name: Nocturne
options:
  bundleIdPrefix: app.nocturne
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.0"
    SWIFT_STRICT_CONCURRENCY: minimal
    MARKETING_VERSION: "1.4.0"
    CURRENT_PROJECT_VERSION: "6"

targets:
  Nocturne:
    type: application
    platform: iOS
    sources:
      - path: Nocturne
    settings:
      base:
        PRODUCT_NAME: Nocturne
        PRODUCT_BUNDLE_IDENTIFIER: com.ross.nocturne
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: ""
        CODE_SIGNING_REQUIRED: "NO"
        CODE_SIGNING_ALLOWED: "NO"
        DEVELOPMENT_TEAM: ""
        CODE_SIGN_ENTITLEMENTS: Nocturne.entitlements
    info:
      path: Nocturne/Info.plist
      properties:
        CFBundleDisplayName: Nocturne
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSRequiresIPhoneOS: true
        ITSAppUsesNonExemptEncryption: false
        UIUserInterfaceStyle: Dark
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        NSContactsUsageDescription: Nocturne shows your contacts and favourites so you can call and message them in a dark theme.
        NSLocationWhenInUseUsageDescription: Nocturne uses your location to show local weather.
        NSCameraUsageDescription: Nocturne uses your camera for video calls.
        NSMicrophoneUsageDescription: Nocturne uses your microphone for video calls.
        CFBundleURLTypes:
          - CFBundleURLName: com.ross.nocturne
            CFBundleURLSchemes:
              - nocturne
        LSApplicationQueriesSchemes:
          - tel
          - facetime
          - sms
