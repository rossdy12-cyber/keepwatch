name: Vault
options:
  bundleIdPrefix: app.keepwatch
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.0"
    SWIFT_STRICT_CONCURRENCY: minimal
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"

targets:
  Vault:
    type: application
    platform: iOS
    sources:
      - path: Vault
    settings:
      base:
        PRODUCT_NAME: Vault
        PRODUCT_BUNDLE_IDENTIFIER: app.keepwatch.vault
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: ""
        CODE_SIGNING_REQUIRED: "NO"
        CODE_SIGNING_ALLOWED: "NO"
        DEVELOPMENT_TEAM: ""
    info:
      path: Vault/Info.plist
      properties:
        CFBundleDisplayName: Vault
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSRequiresIPhoneOS: true
        ITSAppUsesNonExemptEncryption: false
        UILaunchScreen:
          UIColorName: LaunchBackground
        UIUserInterfaceStyle: Dark
        NSFaceIDUsageDescription: Vault uses Face ID to protect your private photos and videos.
        NSPhotoLibraryAddUsageDescription: Vault can save exported photos and videos to your photo library.
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
