name: MediaPipe
options:
  bundleIdPrefix: uk.co.rossdymond
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

packages:
  SocketIO:
    url: https://github.com/socketio/socket.io-client-swift
    from: "16.0.0"

settings:
  base:
    SWIFT_VERSION: "5.10"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic

targets:
  MediaPipe:
    type: application
    platform: iOS
    sources:
      - MediaPipe
    dependencies:
      - package: SocketIO
      - target: MediaPipeShareExtension
        embed: true
    info:
      path: MediaPipe/Info.plist
      properties:
        CFBundleDisplayName: MediaPipe
        CFBundleURLTypes:
          - CFBundleURLName: uk.co.rossdymond.mediapipe
            CFBundleURLSchemes:
              - mediapipe
        UILaunchScreen:
          UIColorName: ""
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
    entitlements:
      path: MediaPipe/MediaPipe.entitlements
      properties:
        com.apple.security.application-groups:
          - group.uk.co.rossdymond.mediapipe
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: uk.co.rossdymond.mediapipe
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: false

  MediaPipeShareExtension:
    type: app-extension
    platform: iOS
    sources:
      - MediaPipeShareExtension
    info:
      path: MediaPipeShareExtension/Info.plist
      properties:
        CFBundleDisplayName: Add to MediaPipe
        NSExtension:
          NSExtensionAttributes:
            NSExtensionActivationRule:
              NSExtensionActivationSupportsWebPageWithMaxCount: 1
              NSExtensionActivationSupportsWebURLWithMaxCount: 1
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ShareViewController
          NSExtensionPointIdentifier: com.apple.share-services
    entitlements:
      path: MediaPipeShareExtension/MediaPipeShareExtension.entitlements
      properties:
        com.apple.security.application-groups:
          - group.uk.co.rossdymond.mediapipe
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: uk.co.rossdymond.mediapipe.ShareExtension
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: false
