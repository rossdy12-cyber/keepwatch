name: StarkFace
options:
  bundleIdPrefix: com.ross
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"

# Only the iPhone wrapper is built by Xcode. The Watch app is compiled by build.sh and copied into
# StarkFace.app/Watch/ by build-and-publish.sh.
targets:
  StarkFace:
    type: application
    platform: iOS
    sources:
      - path: StarkFacePhone
    settings:
      base:
        PRODUCT_NAME: StarkFace
        PRODUCT_BUNDLE_IDENTIFIER: com.ross.starkface
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: ""
        CODE_SIGNING_REQUIRED: "NO"
        CODE_SIGNING_ALLOWED: "NO"
        DEVELOPMENT_TEAM: ""
    info:
      path: StarkFacePhone/Info.plist
      properties:
        CFBundleDisplayName: Stark Face
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSRequiresIPhoneOS: true
        ITSAppUsesNonExemptEncryption: false
        UIUserInterfaceStyle: Dark
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        LSApplicationQueriesSchemes:
          - itms-watchs
