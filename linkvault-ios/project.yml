name: LinkVault
options:
  bundleIdPrefix: uk.co.rossdymond
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.10"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
targets:
  LinkVault:
    type: application
    platform: iOS
    sources:
      - LinkVault
    dependencies:
      - target: LinkVaultShareExtension
        embed: true
    entitlements:
      path: LinkVault/LinkVault.entitlements
      properties:
        com.apple.security.application-groups:
          - group.uk.co.rossdymond.linkvault
    info:
      path: LinkVault/Info.plist
      properties:
        CFBundleDisplayName: LinkVault
        UILaunchScreen:
          UIColorName: ""
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: uk.co.rossdymond.linkvault
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: false
  LinkVaultShareExtension:
    type: app-extension
    platform: iOS
    sources:
      - LinkVaultShareExtension
    entitlements:
      path: LinkVaultShareExtension/LinkVaultShareExtension.entitlements
      properties:
        com.apple.security.application-groups:
          - group.uk.co.rossdymond.linkvault
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: uk.co.rossdymond.linkvault.share
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: false
        INFOPLIST_FILE: LinkVaultShareExtension/Info.plist
        APPLICATION_EXTENSION_API_ONLY: true
        SKIP_INSTALL: true
