name: Prism
options:
  bundleIdPrefix: app.prism
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.0"
    SWIFT_STRICT_CONCURRENCY: minimal
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"

targets:
  Prism:
    type: application
    platform: iOS
    sources:
      - path: Prism
      - path: Shared
    dependencies:
      - target: PrismWidget
    settings:
      base:
        PRODUCT_NAME: Prism
        PRODUCT_BUNDLE_IDENTIFIER: app.prism.client
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: ""
        CODE_SIGNING_REQUIRED: "NO"
        CODE_SIGNING_ALLOWED: "NO"
        DEVELOPMENT_TEAM: ""
        CODE_SIGN_ENTITLEMENTS: Prism.entitlements
    info:
      path: Prism/Info.plist
      properties:
        CFBundleDisplayName: Prism
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSRequiresIPhoneOS: true
        ITSAppUsesNonExemptEncryption: false
        UIUserInterfaceStyle: Dark
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        NSPhotoLibraryAddUsageDescription: Prism saves your themed wallpapers and icons to Photos.

  PrismWidget:
    type: app-extension
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: PrismWidget
      - path: Shared
    settings:
      base:
        PRODUCT_NAME: PrismWidget
        PRODUCT_BUNDLE_IDENTIFIER: app.prism.client.widget
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: ""
        CODE_SIGNING_REQUIRED: "NO"
        CODE_SIGNING_ALLOWED: "NO"
        DEVELOPMENT_TEAM: ""
        SKIP_INSTALL: "YES"
        CODE_SIGN_ENTITLEMENTS: PrismWidget.entitlements
    info:
      path: PrismWidget/Info.plist
      properties:
        CFBundleDisplayName: Prism
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
