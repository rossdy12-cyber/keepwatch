# Jarvis voice hub: "Hey Jarvis" for a Raspberry Pi speaker, with the listening and speech done on TrueNAS.
# TrueNAS: Apps -> Discover Apps -> (three dots) Install via YAML -> name it jarvis-voice -> paste this file.
# First start takes a few minutes (installs the speech tools and downloads the models). Then open the app's Logs:
# they show the one command to run on the Pi. Generated from hub.py by build_compose.py.
services:
  jarvis-voice:
    image: python:3.11-slim
    container_name: jarvis-voice
    restart: unless-stopped
    ports:
      - "10700:10700"   # audio from the Pi
      - "10701:10701"   # the Pi's setup script
    configs:
      - source: hub
        target: /app/hub.py
    volumes:
      # The speech tools, models and the Pi's key live here, so restarts are quick.
      - jarvis-voice-data:/data
    environment:
      # Talk to the Jarvis core directly on your network (skips Cloudflare, and is faster).
      JARVIS_URL: http://100.85.127.42:8998
      SESSION_ID: bedroom-pi
      # "base.en" is quick; "small.en" understands more but is slower.
      WHISPER_MODEL: base.en
      # Jarvis's voice when the core doesn't send its own recording: a natural British male voice (Kokoro).
      # Try bm_george (deep, butler-like), bm_fable, bm_lewis or bm_daniel.
      TTS_VOICE: bm_george
      TTS_SPEED: "0.95"
      # "light" adds a subtle AI-assistant sheen; "none" for the plain voice.
      VOICE_EFFECT: light
      USE_CORE_VOICE: "true"
      # Lower = wakes more easily (and more false wakes). 0.5 is a good start.
      WAKE_THRESHOLD: "0.5"
      # Keep listening this many seconds after a reply, so you can carry on without "Hey Jarvis". 0 = off.
      FOLLOW_UP_SECONDS: "0"
      GREETING: Jarvis is listening.
      TZ: Europe/London
    command:
      - sh
      - -c
      - >-
        ([ -f /data/venv/.ready-3 ] || (python -m venv /data/venv
        && /data/venv/bin/pip install -q --no-cache-dir "openwakeword==0.6.0" "faster-whisper==1.1.1" "piper-tts==1.2.0" "onnxruntime>=1.17,<2" "kokoro-onnx==0.4.9" "imageio-ffmpeg" numpy
        && touch /data/venv/.ready-3))
        && /data/venv/bin/python -c "import imageio_ffmpeg, os; p='/usr/local/bin/ffmpeg'; os.path.exists(p) or os.symlink(imageio_ffmpeg.get_ffmpeg_exe(), p)"
        && exec /data/venv/bin/python -u /app/hub.py

volumes:
  jarvis-voice-data:

configs:
  hub:
    content: |
      """Jarvis voice hub: a "Hey Jarvis" speaker made from a Raspberry Pi and your TrueNAS.

      The Pi only streams its microphone (16 kHz, 16-bit mono) to this hub over the network and plays whatever audio the
      hub sends back. Everything else happens here:

        1. openWakeWord listens for "Hey Jarvis".
        2. A beep tells you it's listening; your question is recorded until you stop talking.
        3. faster-whisper turns it into text (with vocabulary hints for Navidrome, artists, and alarms).
        4. Local skills (alarms, timers, time, volume) or the local Jarvis core answers (POST /api/chat),
           including streaming Navidrome tracks directly to the Pi speaker in 4-second slices so wake-word
           commands ("Hey Jarvis, skip / pause / stop") keep working during music playback.
        5. The reply is spoken with Kokoro: a natural British male voice (Piper as a backup).
      """

      import io
      import json
      import math
      import os
      import queue
      import re
      import secrets
      import socket
      import socketserver
      import struct
      import subprocess
      import sys
      import tempfile
      import threading
      import time
      import urllib.parse
      import urllib.request
      import wave
      from datetime import datetime, timedelta
      from http.server import BaseHTTPRequestHandler, ThreadingHTTPServer

      import numpy as np

      DATA = os.environ.get("DATA_DIR", "/data")
      JARVIS_URL = os.environ.get("JARVIS_URL", "http://127.0.0.1:8998").rstrip("/")
      JARVIS_PATH = os.environ.get("JARVIS_PATH", "/api/chat")
      SESSION_ID = os.environ.get("SESSION_ID", "bedroom-pi")
      AUDIO_PORT = int(os.environ.get("AUDIO_PORT", "10700"))
      HTTP_PORT = int(os.environ.get("HTTP_PORT", "10701"))
      WAKE_THRESHOLD = float(os.environ.get("WAKE_THRESHOLD", "0.5"))
      WHISPER_MODEL = os.environ.get("WHISPER_MODEL", "base.en")
      VOICE = os.environ.get("VOICE", "en_GB-alan-medium")  # Piper backup voice
      TTS_VOICE = os.environ.get("TTS_VOICE", "bm_george")  # Kokoro: bm_george, bm_fable, bm_lewis, bm_daniel
      TTS_SPEED = float(os.environ.get("TTS_SPEED", "0.95"))
      VOICE_EFFECT = os.environ.get("VOICE_EFFECT", "light").lower()
      USE_CORE_VOICE = os.environ.get("USE_CORE_VOICE", "true").lower() in ("1", "true", "yes")
      FOLLOW_UP_SECONDS = float(os.environ.get("FOLLOW_UP_SECONDS", "0"))
      GREETING = os.environ.get("GREETING", "Jarvis is listening.")

      USER_AGENT = "Mozilla/5.0 (compatible; JarvisVoiceHub/2.0)"

      RATE = 16000
      FRAME = 1280  # 80 ms, what openWakeWord expects
      FRAME_BYTES = FRAME * 2

      WHISPER_PROMPT = (
          "Hey Jarvis, play Black Veil Brides on Navidrome, Pierce The Veil, Black Sabbath, shuffle my music, "
          "pause, stop, skip, next song, set an alarm for 6:30, set a timer for 10 minutes, cancel alarm, snooze, volume."
      )


      def log(message):
          print(time.strftime("%H:%M:%S"), message, flush=True)


      # ---------------------------------------------------------------------------------------------- setup

      def load_token():
          token = os.environ.get("TOKEN", "").strip()
          if token:
              return token
          path = os.path.join(DATA, "token")
          if os.path.exists(path):
              return open(path).read().strip()
          token = secrets.token_urlsafe(18)
          os.makedirs(DATA, exist_ok=True)
          with open(path, "w") as handle:
              handle.write(token)
          return token


      TOKEN = load_token()


      def ensure_voice():
          folder = os.path.join(DATA, "voices")
          os.makedirs(folder, exist_ok=True)
          model = os.path.join(folder, VOICE + ".onnx")
          if not os.path.exists(model) or not os.path.exists(model + ".json"):
              lang, name, quality = VOICE.split("-", 2)
              base = "https://huggingface.co/rhasspy/piper-voices/resolve/v1.0.0/%s/%s/%s/%s/%s" % (
                  lang.split("_")[0], lang, name, quality, VOICE)
              for suffix in (".onnx", ".onnx.json"):
                  log("Downloading voice %s%s" % (VOICE, suffix))
                  urllib.request.urlretrieve(base + suffix, model + suffix[5:] if suffix == ".onnx.json" else model)
          return model


      KOKORO_FILES = {
          "kokoro-v1.0.onnx": "https://github.com/thewh1teagle/kokoro-onnx/releases/download/model-files-v1.0/kokoro-v1.0.onnx",
          "voices-v1.0.bin": "https://github.com/thewh1teagle/kokoro-onnx/releases/download/model-files-v1.0/voices-v1.0.bin",
      }


      def load_kokoro():
          folder = os.path.join(DATA, "kokoro")
          os.makedirs(folder, exist_ok=True)
          try:
              for name, url in KOKORO_FILES.items():
                  path = os.path.join(folder, name)
                  if not os.path.exists(path):
                      log("Downloading the Kokoro voice model (%s, first start only)" % name)
                      urllib.request.urlretrieve(url, path + ".part")
                      os.replace(path + ".part", path)
              from kokoro_onnx import Kokoro
              kokoro = Kokoro(os.path.join(folder, "kokoro-v1.0.onnx"), os.path.join(folder, "voices-v1.0.bin"))
              if TTS_VOICE not in kokoro.get_voices():
                  log("Kokoro has no voice %s; using bm_george" % TTS_VOICE)
              return kokoro
          except Exception as error:
              log("Kokoro unavailable, using Piper instead: %s" % error)
              return None


      def load_models():
          from openwakeword.utils import download_models
          download_models(["hey_jarvis"])
          from faster_whisper import WhisperModel
          log("Loading Whisper model %s (first start downloads it)" % WHISPER_MODEL)
          whisper = WhisperModel(WHISPER_MODEL, device="cpu", compute_type="int8", download_root=os.path.join(DATA, "whisper"))
          return whisper, ensure_voice()


      WHISPER, VOICE_MODEL = load_models()
      whisper_lock = threading.Lock()
      KOKORO = load_kokoro()
      kokoro_lock = threading.Lock()


      def new_wake_model():
          from openwakeword.model import Model
          return Model(wakeword_models=["hey_jarvis"], inference_framework="onnx")


      # ---------------------------------------------------------------------------------------------- audio helpers

      def tone_wav(freqs, length=0.12, rate=16000, volume=0.35):
          samples = []
          for freq in freqs:
              count = int(rate * length)
              for i in range(count):
                  fade = min(1.0, i / (rate * 0.01), (count - i) / (rate * 0.01))
                  samples.append(int(volume * fade * 32767 * math.sin(2 * math.pi * freq * i / rate)))
          return pcm_to_wav(struct.pack("<%dh" % len(samples), *samples), rate)


      def pcm_to_wav(pcm, rate):
          buffer = io.BytesIO()
          with wave.open(buffer, "wb") as out:
              out.setnchannels(1)
              out.setsampwidth(2)
              out.setframerate(rate)
              out.writeframes(pcm)
          return buffer.getvalue()


      def wav_seconds(data):
          try:
              with wave.open(io.BytesIO(data)) as w:
                  return w.getnframes() / float(w.getframerate())
          except Exception:
              return 2.0


      BEEP_LISTEN = tone_wav([880, 1320])
      BEEP_NOTHING = tone_wav([660, 440])


      def add_effect(wav):
          if VOICE_EFFECT in ("none", "off", ""):
              return wav
          result = subprocess.run(
              ["ffmpeg", "-v", "error", "-i", "pipe:0", "-af",
               "highpass=f=70,aecho=0.8:0.6:18|36:0.10|0.05,acompressor=threshold=-20dB:ratio=2.5:attack=5:release=80,"
               "loudnorm=I=-16:TP=-1.5", "-ar", "24000", "-ac", "1", "-f", "s16le", "pipe:1"],
              input=wav, capture_output=True, timeout=60)
          return pcm_to_wav(result.stdout, 24000) if result.returncode == 0 and result.stdout else wav


      def speak(text):
          clean = re.sub(r"[*_`#>]", "", text)
          clean = re.sub(r"\[([^\]]+)\]\([^)]+\)", r"\1", clean).strip()
          if not clean:
              return None
          if KOKORO is not None:
              try:
                  voice = TTS_VOICE if TTS_VOICE in KOKORO.get_voices() else "bm_george"
                  with kokoro_lock:
                      samples, rate = KOKORO.create(clean, voice=voice, speed=TTS_SPEED, lang="en-gb")
                  pcm = (np.clip(samples, -1.0, 1.0) * 32767).astype(np.int16).tobytes()
                  return add_effect(pcm_to_wav(pcm, rate))
              except Exception as error:
                  log("Kokoro failed, using Piper: %s" % error)
          return speak_piper(clean)


      def speak_piper(clean):
          with tempfile.NamedTemporaryFile(suffix=".wav", delete=False) as handle:
              path = handle.name
          try:
              piper = os.path.join(os.path.dirname(sys.executable), "piper")
              subprocess.run([piper if os.path.exists(piper) else "piper", "--model", VOICE_MODEL, "--output_file", path],
                             input=clean.encode("utf-8"), capture_output=True, timeout=120, check=True)
              with open(path, "rb") as handle:
                  return handle.read()
          except Exception as error:
              log("Piper failed: %s" % error)
              return None
          finally:
              try:
                  os.unlink(path)
              except OSError:
                  pass


      # ---------------------------------------------------------------------------------------------- Spoken Butler Wake-Word Greetings

      WAKE_PHRASES_DIR = os.path.join(DATA, "wake_phrases")
      DEFAULT_WAKE_PHRASES = [
          ("yes_sir.wav", "Yes, sir?"),
          ("at_your_service.wav", "At your service, sir."),
          ("listening_sir.wav", "Listening, sir."),
      ]
      WAKE_CLIPS = []
      WAKE_CLIP_INDEX = 0


      def init_wake_clips():
          """Pre-renders and caches spoken butler wake acknowledgements in /data/wake_phrases so 'Hey Jarvis' responds in 0ms."""
          global WAKE_CLIPS
          os.makedirs(WAKE_PHRASES_DIR, exist_ok=True)
          clips = []
          for fname, phrase in DEFAULT_WAKE_PHRASES:
              fpath = os.path.join(WAKE_PHRASES_DIR, fname)
              wav_data = None
              if os.path.exists(fpath) and os.path.getsize(fpath) > 500:
                  try:
                      wav_data = open(fpath, "rb").read()
                  except Exception:
                      wav_data = None
              if not wav_data:
                  log("Pre-rendering spoken wake phrase: '%s'" % phrase)
                  wav_data = speak(phrase)
                  if wav_data:
                      try:
                          open(fpath, "wb").write(wav_data)
                      except Exception:
                          pass
              if wav_data:
                  clips.append(wav_data)
          WAKE_CLIPS = clips
          log("Loaded %d spoken butler wake phrases into RAM." % len(WAKE_CLIPS))


      def get_wake_audio():
          """Returns the next pre-rendered spoken wake phrase (or custom phrase if set), falling back to BEEP_LISTEN."""
          global WAKE_CLIP_INDEX
          custom_path = os.path.join(WAKE_PHRASES_DIR, "custom.wav")
          if os.path.exists(custom_path) and os.path.getsize(custom_path) > 500:
              try:
                  return open(custom_path, "rb").read()
              except Exception:
                  pass
          if WAKE_CLIPS:
              clip = WAKE_CLIPS[WAKE_CLIP_INDEX % len(WAKE_CLIPS)]
              WAKE_CLIP_INDEX += 1
              return clip
          return BEEP_LISTEN


      threading.Thread(target=init_wake_clips, daemon=True).start()


      # ---------------------------------------------------------------------------------------------- local skills & alarms

      ALARM_CHIME = tone_wav([1047, 1319, 1047, 1319], length=0.18, volume=0.65)
      TIMER_CHIME = tone_wav([880, 1175, 880, 1175, 880], length=0.14, volume=0.60)
      ALARM_MAX_SECONDS = int(os.environ.get("ALARM_MAX_SECONDS", "600"))
      SNOOZE_MINUTES = int(os.environ.get("SNOOZE_MINUTES", "9"))

      ALARMS_FILE = os.path.join(DATA, "alarms.json")
      alarms_lock = threading.Lock()


      def load_alarms():
          try:
              with open(ALARMS_FILE) as handle:
                  data = json.load(handle)
                  return data if isinstance(data, list) else []
          except Exception:
              return []


      ALARMS = load_alarms()


      def save_alarms():
          try:
              with open(ALARMS_FILE, "w") as handle:
                  json.dump(ALARMS, handle)
          except Exception as error:
              log("Couldn't save alarms: %s" % error)


      def reload_alarms_from_disk():
          global ALARMS
          with alarms_lock:
              ALARMS = load_alarms()
          log("Reloaded alarms (%d active)" % len([a for a in ALARMS if a.get("enabled")]))


      SATELLITES = {}
      satellites_lock = threading.Lock()

      WORD_NUMBERS = {
          "zero": 0, "one": 1, "two": 2, "three": 3, "four": 4, "five": 5, "six": 6, "seven": 7,
          "eight": 8, "nine": 9, "ten": 10, "eleven": 11, "twelve": 12, "thirteen": 13, "fourteen": 14,
          "fifteen": 15, "sixteen": 16, "seventeen": 17, "eighteen": 18, "nineteen": 19, "twenty": 20,
          "thirty": 30, "forty": 40, "fifty": 50, "quarter": 15, "half": 30, "an": 1, "a": 1,
      }


      def _num(word):
          word = word.strip().lower()
          if word.isdigit():
              return int(word)
          return WORD_NUMBERS.get(word)


      def parse_alarm_time(text):
          t = text.lower()
          tomorrow = "tomorrow" in t or "next day" in t
          pm_hint = any(w in t for w in ["afternoon", "evening", "tonight", "night", "p.m", "pm"])
          am_hint = any(w in t for w in ["morning", "a.m", "am"])
          hour = minute = None
          mer = ""

          m = re.search(r"\b(\d{1,2})[:.\s](\d{2})\s*(a\.?m\.?|p\.?m\.?)?", t)
          if m and 0 <= int(m.group(1)) <= 23 and 0 <= int(m.group(2)) <= 59:
              hour, minute = int(m.group(1)), int(m.group(2))
              mer = (m.group(3) or "").replace(".", "")
          else:
              m = re.search(r"\b(\d{1,2})\s*(a\.?m\.?|p\.?m\.?)", t)
              if m:
                  hour, minute, mer = int(m.group(1)), 0, m.group(2).replace(".", "")
              else:
                  oclock = re.search(r"\b(\w+)\s*o'?clock", t)
                  pastto = re.search(r"\b(quarter|half|\w+)\s+(past|to)\s+(\w+)", t)
                  lone = re.search(r"\b(?:at|for)\s+(\w+)", t)
                  if oclock and _num(oclock.group(1)) is not None:
                      hour, minute, mer = _num(oclock.group(1)), 0, ""
                  elif pastto and _num(pastto.group(1)) is not None and _num(pastto.group(3)) is not None:
                      mins, hr = _num(pastto.group(1)), _num(pastto.group(3))
                      if pastto.group(2) == "to":
                          minute, hour = (60 - mins) % 60, (hr - 1) if mins else hr
                      else:
                          minute, hour = mins, hr
                      mer = ""
                  elif lone and _num(lone.group(1)) is not None and 0 <= _num(lone.group(1)) <= 23:
                      hour, minute, mer = _num(lone.group(1)), 0, ""
                  else:
                      return None
          if hour is None:
              return None
          if mer.startswith("p") or (not mer and pm_hint and hour < 12):
              if hour < 12:
                  hour += 12
          elif mer.startswith("a") or (not mer and am_hint):
              if hour == 12:
                  hour = 0
          if not (0 <= hour <= 23 and 0 <= minute <= 59):
              return None
          now = datetime.now()
          target = now.replace(hour=hour, minute=minute, second=0, microsecond=0)
          if tomorrow or target <= now + timedelta(seconds=1):
              target += timedelta(days=1)
          return target


      def parse_duration(text):
          t = text.lower()
          total = 0
          if "half an hour" in t or "half hour" in t:
              total += 1800
          if re.search(r"\b(an|one)\s+hour\b", t) and "half an hour" not in t:
              total += 3600
          for value, unit in re.findall(r"(\d+)\s*(hours?|hrs?|minutes?|mins?|seconds?|secs?)", t):
              value = int(value)
              if unit.startswith(("hour", "hr")):
                  total += value * 3600
              elif unit.startswith("min"):
                  total += value * 60
              else:
                  total += value
          return total if total > 0 else None


      def format_when(when):
          now = datetime.now()
          clock = when.strftime("%I:%M %p").lstrip("0")
          if when.date() == now.date():
              day = "today"
          elif when.date() == (now + timedelta(days=1)).date():
              day = "tomorrow"
          else:
              day = when.strftime("%A")
          return "%s %s" % (clock, day)


      def add_alarm(name, when, label, kind, repeat="once"):
          entry = {
              "id": secrets.token_hex(4),
              "name": name,
              "at": when.timestamp(),
              "time": when.strftime("%H:%M"),
              "label": label or ("Timer" if kind == "timer" else "Jarvis Alarm"),
              "kind": kind,
              "repeat": repeat,
              "enabled": True,
          }
          with alarms_lock:
              ALARMS.append(entry)
              save_alarms()
          return entry


      def finish_alarm(alarm):
          with alarms_lock:
              for a in ALARMS:
                  if a.get("id") == alarm.get("id"):
                      if a.get("repeat") == "daily":
                          a["at"] = float(a["at"]) + 86400
                      else:
                          a["enabled"] = False
              save_alarms()


      def scheduler():
          """Checks alarms every 2 seconds and rings ALL connected satellites until dismissed or 10 min elapsed."""
          last_mtime = 0.0
          while True:
              time.sleep(2)
              try:
                  if os.path.exists(ALARMS_FILE):
                      mtime = os.path.getmtime(ALARMS_FILE)
                      if mtime != last_mtime:
                          last_mtime = mtime
                          with alarms_lock:
                              global ALARMS
                              ALARMS = load_alarms()
              except Exception:
                  pass

              now = time.time()
              with alarms_lock:
                  due = [a for a in ALARMS if a.get("enabled") and now >= float(a.get("at", 0))]

              for alarm in due:
                  at_ts = float(alarm.get("at", 0))
                  if now > at_ts + ALARM_MAX_SECONDS:
                      finish_alarm(alarm)
                      with satellites_lock:
                          for sat in list(SATELLITES.values()):
                              if sat.ringing and sat.ringing.get("id") == alarm.get("id"):
                                  sat.stop_ring()
                      continue

                  # Ring on ALL connected satellites (and automatically resume if a Pi reconnected during the alarm window!)
                  with satellites_lock:
                      sats = list(SATELLITES.values())
                  for sat in sats:
                      if not sat.ringing or sat.ringing.get("id") != alarm.get("id"):
                          sat.start_ring(alarm)


      threading.Thread(target=scheduler, daemon=True).start()


      def apply_gain(wav, gain):
          if gain >= 0.999:
              return wav
          try:
              with wave.open(io.BytesIO(wav)) as w:
                  channels, width, rate = w.getnchannels(), w.getsampwidth(), w.getframerate()
                  frames = w.readframes(w.getnframes())
              if width != 2:
                  return wav
              samples = np.frombuffer(frames, dtype=np.int16).astype(np.float32) * gain
              pcm = np.clip(samples, -32768, 32767).astype(np.int16).tobytes()
              out = io.BytesIO()
              with wave.open(out, "wb") as w2:
                  w2.setnchannels(channels)
                  w2.setsampwidth(2)
                  w2.setframerate(rate)
                  w2.writeframes(pcm)
              return out.getvalue()
          except Exception:
              return wav


      def handle_command(text, sat):
          """Handles alarms, timers, music transport, the time and volume right on the hub."""
          t = " " + text.lower().strip() + " "
          t = re.sub(r"\b(set\s+(?:them|an|a|the)?\s*(?:along|long|warm|arm|lawn))\b", "set an alarm", t)
          say = lambda words: sat.send_audio(speak(words) or BEEP_NOTHING)

          stop_words = re.search(
              r"\b(stop|cancel|dismiss|snooze|turn\s+(?:it|that|the\s+alarm|the\s+timer|the\s+music)\s+off|be\s+quiet|silence|enough|shut\s+up)\b",
              t,
          )

          # 1. Stop or snooze a ringing alarm/timer
          if sat.ringing and stop_words:
              ringing = sat.ringing
              sat.stop_ring()
              finish_alarm(ringing)
              if "snooze" in t:
                  when = datetime.now() + timedelta(minutes=SNOOZE_MINUTES)
                  add_alarm("all", when, ringing.get("label") or "Snoozed Alarm", ringing.get("kind", "alarm"))
                  say("Snoozing for %d minutes, sir." % SNOOZE_MINUTES)
              else:
                  say("Alarm off, sir." if ringing.get("kind") != "timer" else "Timer stopped, sir.")
              return True

          # 2. Music transport controls while Pi is playing music
          if sat.music_playing:
              if re.search(r"\b(skip|next(\s+song|\s+track)?)\b", t):
                  sat.next_track()
                  return True
              if re.search(r"\b(pause(\s+music|\s+the\s+music)?)\b", t):
                  sat.pause_music()
                  say("Paused.")
                  return True
              if stop_words or re.search(r"\b(stop(\s+music|\s+playing)?)\b", t):
                  sat.stop_music()
                  say("Music stopped, sir.")
                  return True
          if sat.music_paused and re.search(r"\b(resume|unpause|continue(\s+playing)?)\b", t):
              sat.resume_music()
              return True

          # 3. Cancel scheduled alarms/timers
          if stop_words and ("alarm" in t or "timer" in t) and "set" not in t and "for" not in t:
              kind = "timer" if "timer" in t else "alarm"
              with alarms_lock:
                  mine = [a for a in ALARMS if a.get("enabled") and a.get("kind", "alarm") == kind]
                  for a in mine:
                      a["enabled"] = False
                  save_alarms()
              say("Cancelled your %s, sir." % kind if len(mine) == 1 else ("Cancelled your %ss, sir." % kind if mine else "You have no %s set, sir." % kind))
              return True

          # 4. Set a timer
          if "timer" in t or (re.search(r"\b(set|start)\b", t) and re.search(r"\bfor\b.*\b(minute|second|hour|min|sec|hr)", t) and "alarm" not in t):
              seconds = parse_duration(t)
              if not seconds:
                  say("How long would you like the timer for, sir?")
                  return True
              when = datetime.now() + timedelta(seconds=seconds)
              add_alarm("all", when, "Jarvis Timer", "timer")
              mins, secs = divmod(seconds, 60)
              hrs, mins = divmod(mins, 60)
              parts = [
                  ("%d hour%s" % (hrs, "" if hrs == 1 else "s")) if hrs else "",
                  ("%d minute%s" % (mins, "" if mins == 1 else "s")) if mins else "",
                  ("%d second%s" % (secs, "" if secs == 1 else "s")) if secs and not hrs else "",
              ]
              say("Timer set for %s, sir." % " ".join(p for p in parts if p).strip())
              return True

          # 5. Set an alarm
          if "alarm" in t or re.search(r"\b(wake\s+me|set\s+.*\s+for)\b", t):
              when = parse_alarm_time(t)
              if not when:
                  say("What time would you like the alarm for, sir?")
                  return True
              repeat = "daily" if ("every day" in t or "daily" in t or "every morning" in t) else "once"
              add_alarm("all", when, "Jarvis Wake-Up Alarm", "alarm", repeat)
              say("Alarm set for %s%s, sir." % (format_when(when), ", every day" if repeat == "daily" else ""))
              return True

          # 6. List alarms
          if re.search(r"\b(what|any|list|my).{0,20}(alarm|timer)", t) or re.search(r"\balarms?\b.{0,10}\?", t):
              with alarms_lock:
                  mine = sorted([a for a in ALARMS if a.get("enabled")], key=lambda a: a.get("at", 0))
              if not mine:
                  say("You have no alarms set, sir.")
              else:
                  items = ", ".join(
                      "%s%s" % (format_when(datetime.fromtimestamp(a["at"])), " (timer)" if a.get("kind") == "timer" else "")
                      for a in mine[:5]
                  )
                  say("You have %d set: %s." % (len(mine), items))
              return True

          # 7. Time / Date
          if re.search(r"\b(what('s| is)? the )?(time|date)\b", t) or "what day" in t or "time is it" in t:
              now = datetime.now()
              if "date" in t or "day" in t:
                  say("It's %s, sir." % now.strftime("%A the %d of %B").replace(" 0", " "))
              else:
                  say("It's %s, sir." % now.strftime("%I:%M %p").lstrip("0"))
              return True

          # 8. Volume
          if re.search(r"\b(volume|louder|quieter|turn (it|the volume) (up|down)|mute|unmute|too (loud|quiet))\b", t):
              m = re.search(r"(\d{1,3})\s*(percent|%)", t)
              if "mute" in t and "unmute" not in t:
                  sat.gain = 0.0
                  return True
              if "unmute" in t or "max" in t:
                  sat.gain = 1.0
              elif m:
                  sat.gain = max(0.0, min(1.5, int(m.group(1)) / 100.0))
              elif re.search(r"\b(up|louder|too quiet)\b", t):
                  sat.gain = min(1.5, sat.gain + 0.25)
              elif re.search(r"\b(down|quieter|too loud)\b", t):
                  sat.gain = max(0.1, sat.gain - 0.25)
              say("Volume %d percent, sir." % round(sat.gain * 100))
              return True

          # 8. Custom wake phrase ("set your wake phrase to ...", "change wake greeting to ...")
          m_wake = re.search(r"\b(?:set|change)\s+(?:your\s+|the\s+)?wake\s+(?:phrase|greeting|word\s+response|chime)\s+to\s+(.+)$$", t)
          if m_wake:
              phrase = m_wake.group(1).strip(" .?!")
              if phrase:
                  os.makedirs(WAKE_PHRASES_DIR, exist_ok=True)
                  custom_path = os.path.join(WAKE_PHRASES_DIR, "custom.wav")
                  if phrase in ("default", "normal", "standard"):
                      if os.path.exists(custom_path):
                          os.unlink(custom_path)
                      say("Restored my standard wake phrases, sir.")
                  else:
                      wav = speak(phrase)
                      if wav:
                          open(custom_path, "wb").write(wav)
                          say("Wake phrase updated to: %s" % phrase)
                  return True

          return False


      def transcribe(audio):
          samples = audio.astype(np.float32) / 32768.0
          with whisper_lock:
              segments, _ = WHISPER.transcribe(
                  samples,
                  language="en",
                  beam_size=1,
                  vad_filter=False,
                  condition_on_previous_text=False,
                  initial_prompt=WHISPER_PROMPT,
              )
              text = " ".join(segment.text for segment in segments).strip()
          if re.fullmatch(r"[\s.,!?]*|(thanks for watching|thank you|you)[.!]?", text.lower()):
              return ""
          return text


      def ask_jarvis(text):
          body = json.dumps({"message": text, "session_id": SESSION_ID}).encode()
          request = urllib.request.Request(
              JARVIS_URL + JARVIS_PATH,
              data=body,
              method="POST",
              headers={"Content-Type": "application/json", "Accept": "application/json", "User-Agent": USER_AGENT},
          )
          with urllib.request.urlopen(request, timeout=90) as response:
              reply = json.loads(response.read() or b"{}")
          if isinstance(reply, dict):
              return (
                  str(reply.get("reply") or reply.get("response") or reply.get("text") or ""),
                  reply.get("audio_url"),
                  reply.get("tracks"),
              )
          return str(reply), None, None


      # ---------------------------------------------------------------------------------------------- one Pi

      class Satellite:
          """One connected Pi: wake word, recording, answering, alarms, and Navidrome music streaming."""

          def __init__(self, sock, name):
              self.sock = sock
              self.name = name
              self.send_lock = threading.Lock()
              self.wake = new_wake_model()
              self.state = "wake"
              self.muted_until = 0.0
              self.noise = 60.0
              self.recording = []
              self.speech_started = False
              self.silence = 0.0
              self.recorded = 0.0
              self.wait_limit = 5.0
              self.pending = b""
              self.gain = 1.0
              self.ringing = None
              # Music queue state
              self.music_queue = []
              self.music_index = 0
              self.music_playing = False
              self.music_paused = False
              self.music_token = 0

          def send_audio(self, wav, tail=0.6, mute=True):
              if not wav:
                  return
              wav = apply_gain(wav, self.gain)
              frame = b"A" + struct.pack(">I", len(wav)) + wav
              with self.send_lock:
                  self.sock.sendall(frame)
              if mute:
                  self.muted_until = max(self.muted_until, time.time()) + wav_seconds(wav) + tail

          def start_ring(self, alarm):
              if self.ringing and self.ringing.get("id") == alarm.get("id"):
                  return
              self.stop_music()
              self.ringing = alarm
              threading.Thread(target=self._ring_loop, args=(alarm,), daemon=True).start()
              log("[%s] %s ringing (%s)" % (self.name, alarm.get("kind", "alarm"), alarm.get("label", "")))

          def stop_ring(self):
              self.ringing = None

          def _ring_loop(self, alarm):
              chime = TIMER_CHIME if alarm.get("kind") == "timer" else ALARM_CHIME
              label = alarm.get("label") or ("Your timer is up, sir." if alarm.get("kind") == "timer" else "Good morning, sir. Your Jarvis alarm is ringing.")
              spoken_wav = speak(label)
              started = time.time()
              cycles = 0
              while self.ringing is alarm and time.time() - started < ALARM_MAX_SECONDS:
                  if self.state == "wake" and time.time() >= self.muted_until:
                      try:
                          self.send_audio(chime, tail=0.0, mute=False)
                          cycles += 1
                          if cycles % 4 == 2 and spoken_wav:
                              time.sleep(0.8)
                              self.send_audio(spoken_wav, tail=0.0, mute=False)
                              time.sleep(2.5)
                          else:
                              time.sleep(1.5)
                      except Exception:
                          break
                  else:
                      time.sleep(0.3)
              if self.ringing is alarm:
                  self.ringing = None

          # ---- Navidrome Music Streaming on Pi ----

          def start_music(self, tracks):
              if not tracks:
                  return
              self.music_queue = list(tracks)
              self.music_index = 0
              self.music_playing = True
              self.music_paused = False
              self.music_token += 1
              tok = self.music_token
              threading.Thread(target=self._music_loop, args=(tok,), daemon=True).start()

          def pause_music(self):
              self.music_playing = False
              self.music_paused = True
              self.music_token += 1

          def resume_music(self):
              if not self.music_queue:
                  return
              self.music_playing = True
              self.music_paused = False
              self.music_token += 1
              tok = self.music_token
              threading.Thread(target=self._music_loop, args=(tok,), daemon=True).start()

          def stop_music(self):
              self.music_playing = False
              self.music_paused = False
              self.music_queue = []
              self.music_token += 1

          def next_track(self):
              if not self.music_queue:
                  return
              self.music_index = (self.music_index + 1) % len(self.music_queue)
              self.music_playing = True
              self.music_paused = False
              self.music_token += 1
              tok = self.music_token
              threading.Thread(target=self._music_loop, args=(tok,), daemon=True).start()

          def _music_loop(self, tok):
              """Streams songs from jarvis-core in 4-second WAV slices so wake-word stays responsive."""
              time.sleep(2.5)  # let the spoken "Playing ..." intro finish first
              rate = 22050
              slice_seconds = 4
              slice_bytes = rate * 2 * slice_seconds  # 16-bit mono
              while self.music_playing and self.music_token == tok and self.music_index < len(self.music_queue):
                  song = self.music_queue[self.music_index]
                  song_id = song.get("id")
                  if not song_id:
                      self.music_index += 1
                      continue
                  stream_url = "%s/rest/stream?id=%s&format=raw" % (JARVIS_URL, urllib.parse.quote(str(song_id)))
                  log("[%s] Streaming track: %s - %s" % (self.name, song.get("artist"), song.get("title")))
                  proc = None
                  try:
                      proc = subprocess.Popen(
                          ["ffmpeg", "-v", "error", "-i", stream_url, "-ac", "1", "-ar", str(rate), "-f", "s16le", "pipe:1"],
                          stdout=subprocess.PIPE,
                      )
                      while self.music_playing and self.music_token == tok:
                          if self.state != "wake":
                              time.sleep(0.2)
                              continue
                          pcm = proc.stdout.read(slice_bytes)
                          if not pcm:
                              break
                          wav = pcm_to_wav(pcm, rate)
                          self.send_audio(wav, tail=0.0, mute=False)
                          dur = len(pcm) / float(rate * 2)
                          slept = 0.0
                          while slept < max(0.2, dur - 0.15) and self.music_playing and self.music_token == tok and self.state == "wake":
                              time.sleep(0.2)
                              slept += 0.2
                  except Exception as e:
                      log("[%s] Music stream error: %s" % (self.name, e))
                      break
                  finally:
                      if proc:
                          try:
                              proc.kill()
                          except Exception:
                              pass
                  if self.music_playing and self.music_token == tok:
                      self.music_index += 1
              if self.music_token == tok:
                  self.music_playing = False

          def feed(self, data):
              self.pending += data
              while len(self.pending) >= FRAME_BYTES:
                  chunk, self.pending = self.pending[:FRAME_BYTES], self.pending[FRAME_BYTES:]
                  self.frame(np.frombuffer(chunk, dtype=np.int16))

          def frame(self, samples):
              now = time.time()
              samples = np.clip(samples.astype(np.int32) * 4, -32768, 32767).astype(np.int16)
              level = float(np.sqrt(np.mean(samples.astype(np.float32) ** 2)))
              if self.state == "busy":
                  return
              if now < self.muted_until:
                  if self.state == "wake":
                      self.wake.predict(np.zeros(FRAME, dtype=np.int16))
                  return
              if self.state == "wake":
                  self.noise = 0.98 * self.noise + 0.02 * level
                  scores = self.wake.predict(samples)
                  best = max(scores.values())
                  if best >= 0.15 and best < min(WAKE_THRESHOLD, 0.35):
                      log("[%s] Near wake word score: %.2f" % (self.name, best))
                  if best >= min(WAKE_THRESHOLD, 0.35):
                      log("[%s] Wake word heard (%.2f)" % (self.name, best))
                      self.wake.reset()
                      self.start_recording(wait_limit=6.0)
                      self.send_audio(get_wake_audio(), tail=0.08)
                  return
              # Recording a question.
              self.recording.append(samples.copy())
              self.recorded += FRAME / RATE
              loud = level > max(self.noise * 2.2, 180)
              if loud:
                  self.speech_started = True
                  self.silence = 0.0
              else:
                  self.silence += FRAME / RATE
              if not self.speech_started and self.recorded > self.wait_limit:
                  log("[%s] Nothing said" % self.name)
                  self.back_to_wake()
                  if self.wait_limit > 3:
                      self.send_audio(BEEP_NOTHING)
              elif (self.speech_started and self.silence > 0.9) or self.recorded > 15:
                  audio = np.concatenate(self.recording)
                  self.state = "busy"
                  threading.Thread(target=self.answer, args=(audio,), daemon=True).start()

          def start_recording(self, wait_limit):
              self.state = "record"
              self.recording, self.speech_started, self.silence, self.recorded = [], False, 0.0, 0.0
              self.wait_limit = wait_limit

          def back_to_wake(self):
              self.state = "wake"
              self.recording = []
              self.wake.reset()

          def answer(self, audio):
              try:
                  text = transcribe(audio)
                  if not text:
                      log("[%s] Couldn't make out any words" % self.name)
                      self.send_audio(BEEP_NOTHING)
                      return
                  log("[%s] Heard: %s" % (self.name, text))
                  try:
                      if handle_command(text, self):
                          return
                  except Exception as error:
                      log("[%s] Local command error: %s" % (self.name, error))
                  try:
                      reply, audio_url, tracks = ask_jarvis(text)
                  except Exception as error:
                      log("[%s] Jarvis core error: %s" % (self.name, error))
                      reply, audio_url, tracks = "Sorry, I can't reach the local Jarvis core at the moment.", None, None
                  log("[%s] Jarvis: %s" % (self.name, reply))
                  self.send_audio(speak(reply) or BEEP_NOTHING)
                  if tracks and isinstance(tracks, list) and len(tracks) > 0:
                      self.start_music(tracks)
              except Exception as error:
                  log("[%s] Error: %s" % (self.name, error))
                  self.send_audio(BEEP_NOTHING)
              finally:
                  if FOLLOW_UP_SECONDS > 0 and self.state == "busy":
                      self.start_recording(wait_limit=FOLLOW_UP_SECONDS)
                  else:
                      self.back_to_wake()


      class AudioHandler(socketserver.BaseRequestHandler):
          def handle(self):
              sock = self.request
              sock.settimeout(45)
              name, satellite = None, None
              try:
                  hello = b""
                  while not hello.endswith(b"\n") and len(hello) < 512:
                      byte = sock.recv(1)
                      if not byte:
                          return
                      hello += byte
                  parts = hello.decode("utf-8", "replace").split()
                  if len(parts) < 2 or parts[0] != "JARVIS1" or not secrets.compare_digest(parts[1], TOKEN):
                      log("Refused a connection from %s (wrong key)" % self.client_address[0])
                      return
                  name = parts[2] if len(parts) > 2 else self.client_address[0]
                  log("[%s] Connected from %s" % (name, self.client_address[0]))
                  satellite = Satellite(sock, name)
                  with satellites_lock:
                      SATELLITES[name] = satellite
                  if GREETING:
                      threading.Thread(target=lambda: satellite.send_audio(speak(GREETING)), daemon=True).start()
                  while True:
                      data = sock.recv(8192)
                      if not data:
                          break
                      satellite.feed(data)
              except (OSError, socket.timeout) as error:
                  log("Connection ended: %s" % error)
              finally:
                  if name is not None:
                      with satellites_lock:
                          if SATELLITES.get(name) is satellite:
                              SATELLITES.pop(name, None)
                  log("Disconnected: %s" % self.client_address[0])


      class AudioServer(socketserver.ThreadingTCPServer):
          allow_reuse_address = True
          daemon_threads = True


      # ---------------------------------------------------------------------------------------------- Pi installer & HTTP control

      PI_CLIENT = r'''#!/usr/bin/env python3
      """Jarvis Pi speaker: streams the microphone to the Jarvis voice hub and plays what it sends back.
      Only uses the Python standard library plus arecord/aplay, so it runs happily on a Raspberry Pi 1."""
      import os, queue, socket, struct, subprocess, threading, time

      HUB = os.environ.get("HUB_HOST", "")
      PORT = int(os.environ.get("HUB_PORT", "10700"))
      TOKEN = os.environ.get("HUB_TOKEN", "")
      NAME = os.environ.get("SATELLITE_NAME", socket.gethostname())
      MIC = os.environ.get("MIC_DEVICE", "default")
      SPEAKER = os.environ.get("SPEAKER_DEVICE", "default")

      playback = queue.Queue()

      def player():
          while True:
              wav = playback.get()
              try:
                  subprocess.run(["aplay", "-q", "-D", SPEAKER, "-"], input=wav, timeout=300)
              except Exception as error:
                  print("aplay failed:", error, flush=True)

      threading.Thread(target=player, daemon=True).start()

      def recv_exact(sock, count):
          data = b""
          while len(data) < count:
              chunk = sock.recv(count - len(data))
              if not chunk:
                  raise ConnectionError("hub closed the connection")
              data += chunk
          return data

      def run_once():
          sock = socket.create_connection((HUB, PORT), timeout=10)
          sock.settimeout(None)
          sock.setsockopt(socket.IPPROTO_TCP, socket.TCP_NODELAY, 1)
          sock.sendall(("JARVIS1 %s %s\n" % (TOKEN, NAME)).encode())
          mic = subprocess.Popen(["arecord", "-q", "-D", MIC, "-f", "S16_LE", "-r", "16000", "-c", "1", "-t", "raw"],
                                 stdout=subprocess.PIPE)
          stop = threading.Event()

          def stream():
              try:
                  while not stop.is_set():
                      data = mic.stdout.read(2560)
                      if not data:
                          break
                      sock.sendall(data)
              except OSError:
                  pass
              finally:
                  stop.set()
                  try:
                      sock.shutdown(socket.SHUT_RDWR)
                  except OSError:
                      pass

          threading.Thread(target=stream, daemon=True).start()
          print("Connected to the Jarvis hub at %s:%d" % (HUB, PORT), flush=True)
          try:
              while not stop.is_set():
                  kind = recv_exact(sock, 1)
                  length = struct.unpack(">I", recv_exact(sock, 4))[0]
                  payload = recv_exact(sock, length)
                  if kind == b"A":
                      playback.put(payload)
          finally:
              stop.set()
              mic.kill()
              sock.close()

      while True:
          try:
              run_once()
          except Exception as error:
              print("Hub connection problem:", error, "- retrying in 5 s", flush=True)
          time.sleep(5)
      '''

      PI_SETUP = r'''#!/bin/bash
