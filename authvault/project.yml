# XcodeGen project description. The "Build AuthVault IPA" workflow turns this into
# AuthVault.xcodeproj with `xcodegen generate`.
name: AuthVault
options:
  bundleIdPrefix: app.authvault
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.0"
    SWIFT_STRICT_CONCURRENCY: minimal
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"

targets:
  AuthVault:
    type: application
    platform: iOS
    sources:
      - path: AuthVault
    settings:
      base:
        PRODUCT_NAME: AuthVault
        PRODUCT_BUNDLE_IDENTIFIER: app.authvault.client
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: ""
        CODE_SIGNING_REQUIRED: "NO"
        CODE_SIGNING_ALLOWED: "NO"
        DEVELOPMENT_TEAM: ""
    info:
      path: AuthVault/Info.plist
      properties:
        CFBundleDisplayName: AuthVault
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSRequiresIPhoneOS: true
        ITSAppUsesNonExemptEncryption: false
        UIUserInterfaceStyle: Dark
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        NSCameraUsageDescription: AuthVault uses the camera to scan authenticator QR codes.
        NSFaceIDUsageDescription: AuthVault uses Face ID to unlock your codes.
        # Only used for the optional encrypted backup to your own NAS (WebDAV), often over the local network.
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
        NSLocalNetworkUsageDescription: AuthVault connects to your NAS to store an encrypted backup, if you set one up.
