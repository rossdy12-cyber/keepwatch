# Paydays: monthly bills against weekly pay, and how much is safe to spend each week.
# TrueNAS: Apps -> Discover Apps -> (three dots) Install via YAML -> name it paydays -> paste this file.
# Then open http://<nas-ip>:8450 (or add a proxy host for it). Generated from server.py by build_compose.py.
services:
  paydays:
    image: python:3.12-alpine
    container_name: paydays
    restart: unless-stopped
    command: python -u /app/server.py
    ports:
      - "8450:8450"
    configs:
      - source: server
        target: /app/server.py
    volumes:
      # Your bills and pay are kept here. To keep them in a dataset you back up, replace this with a path,
      # e.g. /mnt/<pool>/apps/paydays:/data
      - paydays-data:/data
    environment:
      TZ: Europe/London
      # Optional: a password for the page (username can be anything). Leave empty if it sits behind Authelia.
      APP_PASSWORD: ""
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8450/health')"]
      interval: 60s
      timeout: 5s

volumes:
  paydays-data:

configs:
  server:
    content: |
      """Paydays: monthly bills against weekly pay.

      A tiny self-hosted web app. Python standard library only (http.server + sqlite3), one file,
      data in /data/paydays.db. Amounts are stored in pence.
      """

      import base64
      import hmac
      import json
      import math
      import os
      import re
      import secrets
      import sqlite3
      import threading
      import time
      import urllib.error
      import urllib.request
      from datetime import date, datetime, timedelta, timezone
      from http.server import BaseHTTPRequestHandler, ThreadingHTTPServer
      from urllib.parse import parse_qs, quote, urlparse

      DB_PATH = os.environ.get("DB_PATH", "/data/paydays.db")
      PORT = int(os.environ.get("PORT", "8450"))
      PASSWORD = os.environ.get("APP_PASSWORD", "")

      db_lock = threading.Lock()
      alerts_lock = threading.Lock()  # one alert check at a time, so an alert is never sent twice


      def connect():
          folder = os.path.dirname(DB_PATH)
          if folder:
              os.makedirs(folder, exist_ok=True)
          conn = sqlite3.connect(DB_PATH, check_same_thread=False)
          conn.row_factory = sqlite3.Row
          conn.executescript(
              """
              PRAGMA journal_mode=WAL;
              CREATE TABLE IF NOT EXISTS bills (
                  id INTEGER PRIMARY KEY AUTOINCREMENT,
                  name TEXT NOT NULL,
                  amount INTEGER NOT NULL,
                  day INTEGER NOT NULL,
                  category TEXT NOT NULL DEFAULT '',
                  active INTEGER NOT NULL DEFAULT 1
              );
              CREATE TABLE IF NOT EXISTS pays (
                  id INTEGER PRIMARY KEY AUTOINCREMENT,
                  date TEXT NOT NULL,
                  amount INTEGER NOT NULL,
                  kind TEXT NOT NULL DEFAULT 'pay',
                  note TEXT NOT NULL DEFAULT ''
              );
              CREATE INDEX IF NOT EXISTS pays_date ON pays(date);
              CREATE TABLE IF NOT EXISTS paid (
                  bill_id INTEGER NOT NULL,
                  month TEXT NOT NULL,
                  PRIMARY KEY (bill_id, month)
              );
              CREATE TABLE IF NOT EXISTS months (
                  month TEXT PRIMARY KEY,
                  opening INTEGER NOT NULL DEFAULT 0
              );
              CREATE TABLE IF NOT EXISTS settings (
                  key TEXT PRIMARY KEY,
                  value TEXT NOT NULL
              );
              """
          )
          # Columns added after the first version.
          columns = {row["name"] for row in conn.execute("PRAGMA table_info(pays)")}
          if "source" not in columns:
              conn.execute("ALTER TABLE pays ADD COLUMN source TEXT NOT NULL DEFAULT ''")
          if "created" not in columns:
              conn.execute("ALTER TABLE pays ADD COLUMN created REAL NOT NULL DEFAULT 0")
          conn.commit()
          return conn


      conn = connect()

      DEFAULT_SETTINGS = {
          "pay_amount": "0", "pay_frequency": "weekly", "pay_anchor": "", "currency": "GBP", "savings": "0",
          "hook_token": "", "ntfy_server": "https://ntfy.sh", "ntfy_topic": "", "ntfy_token": "",
          "alert_over": "1", "alert_pace": "1", "alert_big": "0", "public_url": "", "alerts_sent": "{}",
      }


      def read_settings():
          """Every setting as a string. Call with db_lock held."""
          settings = dict(DEFAULT_SETTINGS)
          settings.update({row["key"]: row["value"] for row in conn.execute("SELECT key, value FROM settings")})
          return settings


      def write_setting(key, value):
          """Call with db_lock held, inside a transaction."""
          conn.execute(
              "INSERT INTO settings (key, value) VALUES (?, ?) ON CONFLICT(key) DO UPDATE SET value = excluded.value",
              (key, str(value)),
          )


      # The private key in the Apple Pay Shortcut's link. Made once, kept in the database.
      with db_lock, conn:
          if not read_settings()["hook_token"]:
              write_setting("hook_token", secrets.token_urlsafe(24))
      DATE_RE = re.compile(r"^\d{4}-\d{2}-\d{2}\Z")
      MONTH_RE = re.compile(r"^\d{4}-\d{2}\Z")


      class BadRequest(Exception):
          pass


      def as_pence(value, allow_negative=False):
          try:
              number = int(value)
          except (TypeError, ValueError):
              raise BadRequest("Amount must be a whole number of pence")
          if not allow_negative and number < 0:
              raise BadRequest("Amount can't be negative")
          if abs(number) > 10_000_000_00:
              raise BadRequest("Amount is too large")
          return number


      def as_date(value):
          if not isinstance(value, str) or not DATE_RE.match(value):
              raise BadRequest("Date must look like 2026-11-28")
          try:
              date.fromisoformat(value)
          except ValueError:
              raise BadRequest("That date doesn't exist")
          return value


      def as_month(value):
          if not isinstance(value, str) or not MONTH_RE.match(value):
              raise BadRequest("Month must look like 2026-11")
          return value


      def as_text(value, limit=80, required=False):
          text = str(value or "").strip()[:limit]
          if required and not text:
              raise BadRequest("Please give it a name")
          return text


      def everything():
          with db_lock:
              settings = read_settings()
              return {
                  "bills": [dict(r) for r in conn.execute("SELECT * FROM bills ORDER BY day, name")],
                  "pays": [dict(r) for r in conn.execute("SELECT * FROM pays ORDER BY date")],
                  "paid": [dict(r) for r in conn.execute("SELECT * FROM paid")],
                  "months": {r["month"]: r["opening"] for r in conn.execute("SELECT * FROM months")},
                  "settings": {
                      "pay_amount": int(settings["pay_amount"] or 0),
                      "pay_frequency": settings["pay_frequency"],
                      "pay_anchor": settings["pay_anchor"],
                      "currency": settings["currency"],
                      "savings": int(settings["savings"] or 0),
                      "hook_token": settings["hook_token"],
                      "ntfy_server": settings["ntfy_server"],
                      "ntfy_topic": settings["ntfy_topic"],
                      "ntfy_token_set": bool(settings["ntfy_token"]),
                      "alert_over": settings["alert_over"] == "1",
                      "alert_pace": settings["alert_pace"] == "1",
                      "alert_big": int(settings["alert_big"] or 0),
                  },
              }


      def handle_api(method, path, body):
          parts = [p for p in path.split("/") if p][1:]  # drop "api"
          if method == "GET" and parts == ["data"]:
              return everything()

          after_commit = []
          with db_lock, conn:
              if parts == ["bills"] and method == "POST":
                  day = int(body.get("day") or 0)
                  if not 1 <= day <= 31:
                      raise BadRequest("Day must be between 1 and 31")
                  conn.execute(
                      "INSERT INTO bills (name, amount, day, category) VALUES (?, ?, ?, ?)",
                      (as_text(body.get("name"), required=True), as_pence(body.get("amount")), day,
                       as_text(body.get("category"), 40)),
                  )
              elif len(parts) == 2 and parts[0] == "bills" and method == "PUT":
                  day = int(body.get("day") or 0)
                  if not 1 <= day <= 31:
                      raise BadRequest("Day must be between 1 and 31")
                  conn.execute(
                      "UPDATE bills SET name = ?, amount = ?, day = ?, category = ?, active = ? WHERE id = ?",
                      (as_text(body.get("name"), required=True), as_pence(body.get("amount")), day,
                       as_text(body.get("category"), 40), 1 if body.get("active", True) else 0, int(parts[1])),
                  )
              elif len(parts) == 2 and parts[0] == "bills" and method == "DELETE":
                  conn.execute("DELETE FROM bills WHERE id = ?", (int(parts[1]),))
                  conn.execute("DELETE FROM paid WHERE bill_id = ?", (int(parts[1]),))
              elif parts == ["pay"] and method == "PUT":
                  # The actual amount for one payday. null puts it back to the usual amount.
                  day = as_date(body.get("date"))
                  conn.execute("DELETE FROM pays WHERE date = ? AND kind = 'pay'", (day,))
                  if body.get("amount") is not None:
                      conn.execute("INSERT INTO pays (date, amount, kind) VALUES (?, ?, 'pay')", (day, as_pence(body["amount"])))
              elif parts == ["extra"] and method == "POST":
                  conn.execute(
                      "INSERT INTO pays (date, amount, kind, note) VALUES (?, ?, 'extra', ?)",
                      (as_date(body.get("date")), as_pence(body.get("amount"), allow_negative=True),
                       as_text(body.get("note"), 60) or "Extra"),
                  )
              elif len(parts) == 2 and parts[0] == "extra" and method == "DELETE":
                  conn.execute("DELETE FROM pays WHERE id = ? AND kind = 'extra'", (int(parts[1]),))
              elif parts == ["spend"] and method == "POST":
                  # Day-to-day spending, so "safe to spend" knows what's left this pay period.
                  amount = as_pence(body.get("amount"))
                  if amount == 0:
                      raise BadRequest("Enter how much you spent")
                  conn.execute(
                      "INSERT INTO pays (date, amount, kind, note, source, created) VALUES (?, ?, 'spend', ?, 'manual', ?)",
                      (as_date(body.get("date")), amount, as_text(body.get("note"), 60), time.time()),
                  )
                  after_commit.append(lambda: check_alerts(amount, as_text(body.get("note"), 60) or "Spending"))
              elif len(parts) == 2 and parts[0] == "spend" and method == "DELETE":
                  conn.execute("DELETE FROM pays WHERE id = ? AND kind = 'spend'", (int(parts[1]),))
              elif parts == ["paid"] and method == "PUT":
                  bill_id, month = int(body.get("bill_id") or 0), as_month(body.get("month"))
                  if body.get("paid"):
                      conn.execute("INSERT OR IGNORE INTO paid (bill_id, month) VALUES (?, ?)", (bill_id, month))
                  else:
                      conn.execute("DELETE FROM paid WHERE bill_id = ? AND month = ?", (bill_id, month))
              elif parts == ["month"] and method == "PUT":
                  conn.execute(
                      "INSERT INTO months (month, opening) VALUES (?, ?) ON CONFLICT(month) DO UPDATE SET opening = excluded.opening",
                      (as_month(body.get("month")), as_pence(body.get("opening"), allow_negative=True)),
                  )
              elif parts == ["settings"] and method == "PUT":
                  frequency = body.get("pay_frequency", "weekly")
                  if frequency not in ("weekly", "fortnightly", "fourweekly", "monthly"):
                      raise BadRequest("Unknown pay frequency")
                  anchor = body.get("pay_anchor") or ""
                  if anchor:
                      as_date(anchor)
                  values = {"pay_amount": str(as_pence(body.get("pay_amount"))), "pay_frequency": frequency, "pay_anchor": anchor,
                            "savings": str(as_pence(body.get("savings") or 0))}
                  for key, value in values.items():
                      write_setting(key, value)
              elif parts == ["alerts"] and method == "PUT":
                  server = str(body.get("ntfy_server") or "https://ntfy.sh").strip().rstrip("/")
                  if not server.lower().startswith(("https://", "http://")):
                      raise BadRequest("The ntfy server should start with https://")
                  topic = as_text(body.get("ntfy_topic"), 120)
                  if topic and not re.match(r"^[A-Za-z0-9_-]+\Z", topic):
                      raise BadRequest("The ntfy topic can only use letters, numbers, - and _")
                  write_setting("ntfy_server", server)
                  write_setting("ntfy_topic", topic)
                  if body.get("ntfy_token") is not None:
                      write_setting("ntfy_token", as_text(body.get("ntfy_token"), 200))
                  write_setting("alert_over", "1" if body.get("alert_over") else "0")
                  write_setting("alert_pace", "1" if body.get("alert_pace") else "0")
                  write_setting("alert_big", as_pence(body.get("alert_big") or 0))
                  if body.get("public_url"):
                      write_setting("public_url", as_text(body.get("public_url"), 200))
              elif parts == ["alerts", "test"] and method == "POST":
                  after_commit.append(lambda: send_test_alert())
              elif parts == ["hook-token"] and method == "POST":
                  write_setting("hook_token", secrets.token_urlsafe(24))
              else:
                  return None
          for action in after_commit:
              action()
          return everything()


      # ---------- What's left until payday, worked out on the server ----------
      # This mirrors the page's JavaScript (paydaysBetween, billsBetween, savingPlan, payBreakdown) so the Apple Pay
      # Shortcut and the alerts see the same numbers as the Month tab.

      PAYS_PER_YEAR = {"weekly": 365.25 / 7, "fortnightly": 365.25 / 14, "fourweekly": 365.25 / 28, "monthly": 12}
      STEP_DAYS = {"weekly": 7, "fortnightly": 14, "fourweekly": 28}


      def uk_today():
          """Today's date in the UK (the container may not have time zone data)."""
          now = datetime.now(timezone.utc)
          def last_sunday(year, month):
              d = date(year, month, 31)
              return d - timedelta(days=(d.weekday() + 1) % 7)
          start = datetime.combine(last_sunday(now.year, 3), datetime.min.time(), timezone.utc) + timedelta(hours=1)
          end = datetime.combine(last_sunday(now.year, 10), datetime.min.time(), timezone.utc) + timedelta(hours=1)
          return (now + timedelta(hours=1 if start <= now < end else 0)).date()


      def days_in(year, month):
          return (date(year + month // 12, month % 12 + 1, 1) - timedelta(days=1)).day


      def paydays_between(settings, start, end):
          if not settings["pay_anchor"]:
              return []
          anchor = date.fromisoformat(settings["pay_anchor"])
          if settings["pay_frequency"] == "monthly":
              out, year, month = [], start.year, start.month
              for _ in range(24):
                  d = date(year, month, min(anchor.day, days_in(year, month)))
                  if d > end:
                      break
                  if d >= start:
                      out.append(d)
                  month += 1
                  if month > 12:
                      month, year = 1, year + 1
              return out
          step = STEP_DAYS.get(settings["pay_frequency"], 7)
          k = math.ceil((start - anchor).days / step)
          out, d = [], anchor + timedelta(days=k * step)
          while d <= end:
              out.append(d)
              d += timedelta(days=step)
          return out


      def bills_between(bills, start, end):
          out, year, month = [], start.year, start.month
          for _ in range(24):
              if date(year, month, 1) > end:
                  break
              for bill in bills:
                  if not bill["active"]:
                      continue
                  d = date(year, month, min(bill["day"], days_in(year, month)))
                  if start <= d <= end:
                      out.append((d, bill))
              month += 1
              if month > 12:
                  month, year = 1, year + 1
          out.sort(key=lambda item: (item[0], item[1]["name"]))
          return out


      def set_aside_for(settings, bills, payday):
          """What the saving plan puts aside from one payday (bills plus savings)."""
          occurrences = bills_between(bills, payday - timedelta(days=150), payday + timedelta(days=120))
          pays = paydays_between(settings, payday - timedelta(days=190), payday + timedelta(days=120))
          total = 0
          for i, (due, bill) in enumerate(occurrences):
              if due <= payday:
                  continue
              window = []
              for j in range(i - 1, -1, -1):
                  prev_due, prev = occurrences[j]
                  if prev_due >= due or prev["amount"] * 2 < bill["amount"]:
                      continue
                  window = [t for t in pays if prev_due <= t < due]
                  if window:
                      break
              if payday not in window:
                  continue
              share, extra = divmod(bill["amount"], len(window))
              total += share + (1 if window.index(payday) < extra else 0)
          per_year = PAYS_PER_YEAR.get(settings["pay_frequency"], 0)
          savings = int(settings["savings"] or 0)
          if per_year and savings:
              total += math.ceil(savings * 12 / per_year)
          return total


      def period_status():
          """This pay period's budget: allowance, spent, left, days left. None until pay is set up."""
          with db_lock:
              settings = read_settings()
              bills = [dict(r) for r in conn.execute("SELECT * FROM bills")]
              if not settings["pay_anchor"] or not int(settings["pay_amount"] or 0):
                  return None
              today = uk_today()
              recent = paydays_between(settings, today - timedelta(days=40), today)
              upcoming = paydays_between(settings, today + timedelta(days=1), today + timedelta(days=40))
              if not recent or not upcoming:
                  return None
              start, next_pay = recent[-1], upcoming[0]
              end = next_pay - timedelta(days=1)
              actual = conn.execute("SELECT amount FROM pays WHERE kind = 'pay' AND date = ?", (start.isoformat(),)).fetchone()
              spent = conn.execute(
                  "SELECT COALESCE(SUM(amount), 0) FROM pays WHERE kind = 'spend' AND date BETWEEN ? AND ?",
                  (start.isoformat(), end.isoformat()),
              ).fetchone()[0]
          pay = actual["amount"] if actual else int(settings["pay_amount"])
          allowance = max(0, pay - set_aside_for(settings, bills, start))
          left = allowance - spent
          days_left = (end - today).days + 1
          return {
              "start": start, "end": end, "next": next_pay, "today": today, "allowance": allowance, "spent": spent,
              "left": left, "days_left": days_left, "per_day": left // days_left if left > 0 else 0,
              "period_days": (end - start).days + 1,
          }


      def money(pence):
          sign = "-" if pence < 0 else ""
          return "%s\u00a3%s" % (sign, format(abs(pence) / 100, ",.2f"))


      def status_line(status):
          if status is None:
              return "Set up your pay in Paydays to see what's left."
          weekday = status["next"].strftime("%A")
          if status["left"] < 0:
              return "Over by %s until %s." % (money(-status["left"]), weekday)
          return "%s left until %s (%s a day)." % (money(status["left"]), weekday, money(status["per_day"]))


      def send_ntfy(title, message, tags="moneybag", priority="default"):
          with db_lock:
              settings = read_settings()
          if not settings["ntfy_topic"]:
              return False
          url = settings["ntfy_server"].rstrip("/") + "/" + quote(settings["ntfy_topic"])
          # RFC 2047 so "\u00a3" and emoji survive in the title (ntfy decodes it).
          encoded_title = "=?UTF-8?B?" + base64.b64encode(title.encode("utf-8")).decode("ascii") + "?="
          headers = {"Title": encoded_title, "Tags": tags, "Priority": priority}
          if settings["public_url"]:
              headers["Click"] = settings["public_url"]
          if settings["ntfy_token"]:
              headers["Authorization"] = "Bearer " + settings["ntfy_token"]
          request = urllib.request.Request(url, data=message.encode("utf-8"), method="POST", headers=headers)
          try:
              with urllib.request.urlopen(request, timeout=15) as response:
                  response.read()
              return True
          except (urllib.error.URLError, OSError) as error:
              print("ntfy alert failed: %s" % error, flush=True)
              return False


      def check_alerts(amount, merchant):
          """After each payment: warn once per pay period about going over or spending too fast, and about big payments."""
          with alerts_lock:
              _check_alerts(amount, merchant)


      def _check_alerts(amount, merchant):
          status = period_status()
          with db_lock:
              settings = read_settings()
          if status is None or not settings["ntfy_topic"]:
              return
          period = status["start"].isoformat()
          try:
              sent = json.loads(settings["alerts_sent"] or "{}")
          except ValueError:
              sent = {}
          sent = {key: value for key, value in sent.items() if key >= (status["today"] - timedelta(days=60)).isoformat()}
          already = set(sent.get(period, []))
          alerts = []
          big = int(settings["alert_big"] or 0)
          if big and amount >= big:
              alerts.append(("big", "Big payment: %s" % money(amount), "%s %s. %s" % (merchant, money(amount), status_line(status)), "warning", "default"))
          if settings["alert_over"] == "1" and status["left"] < 0 and "over" not in already:
              alerts.append(("over", "Over budget until payday",
                             "You've spent %s of %s from this pay. %s" % (money(status["spent"]), money(status["allowance"]), status_line(status)),
                             "rotating_light", "high"))
          elapsed = (status["today"] - status["start"]).days + 1
          expected = status["allowance"] * elapsed / max(1, status["period_days"])
          if (settings["alert_pace"] == "1" and status["left"] >= 0 and "pace" not in already and status["allowance"]
                  and status["spent"] > expected + status["allowance"] * 0.15 and status["spent"] >= status["allowance"] * 0.4):
              alerts.append(("pace", "Spending fast this week",
                             "%d%% gone with %d of %d days to go. %s" % (round(status["spent"] * 100 / status["allowance"]),
                                                                       status["days_left"], status["period_days"], status_line(status)),
                             "warning", "high"))
          for key, title, message, tags, priority in alerts:
              if send_ntfy(title, message, tags, priority) and key != "big":
                  already.add(key)
          sent[period] = sorted(already)
          with db_lock, conn:
              write_setting("alerts_sent", json.dumps(sent))


      def send_test_alert():
          status = period_status()
          send_ntfy("Paydays alerts are on", "This is a test. " + status_line(status), "white_check_mark")


      def parse_amount(value):
          """Shortcuts may send 23.4, "23.40", "\u00a323.40" or "23,40". Returns pence."""
          if isinstance(value, (int, float)):
              pence = round(float(value) * 100)
          else:
              text = re.sub(r"[^0-9.,\-]", "", str(value or ""))
              if text.count(",") == 1 and "." not in text and len(text.split(",")[1]) == 2:
                  text = text.replace(",", ".")
              text = text.replace(",", "")
              try:
                  pence = round(float(text) * 100)
              except ValueError:
                  return 0
          return abs(pence)


      def handle_hook(body):
          """An Apple Pay payment from the iPhone Shortcut. Returns the line shown in the notification."""
          amount = parse_amount(body.get("amount"))
          merchant = as_text(body.get("merchant"), 60)
          raw = str(body.get("raw") or "").strip()
          if raw and (amount <= 0 or not merchant):
              # The Shortcut also sends the whole transaction as text, in case Amount / Merchant came through empty.
              found = re.search(r"[\u00a3\u20ac\x24]\s?(\d{1,3}(?:,\d{3})*(?:[.,]\d{2})|\d+(?:[.,]\d{2})?)", raw) \
                  or re.search(r"(\d+[.,]\d{2})", raw)
              if amount <= 0 and found:
                  amount = parse_amount(found.group(1))
              if not merchant:
                  rest = raw.replace(found.group(0), " ") if found else raw
                  merchant = as_text(re.sub(r"\s+", " ", rest).strip(" -,:"), 60)
          merchant = merchant or "Apple Pay"
          if amount <= 0:
              if not as_text(body.get("merchant"), 60) and not raw:
                  # Run by hand with the play button: no payment came with it.
                  return "Connected to Paydays \u2713 Pay with Apple Pay to log a payment. " + status_line(period_status())
              return "Couldn't read the amount from Apple Pay. Add it in Paydays with + Spent."
          today = uk_today().isoformat()
          with db_lock, conn:
              duplicate = conn.execute(
                  "SELECT 1 FROM pays WHERE kind = 'spend' AND amount = ? AND note = ? AND created > ?",
                  (amount, merchant, time.time() - 120),
              ).fetchone()
              if not duplicate:
                  conn.execute(
                      "INSERT INTO pays (date, amount, kind, note, source, created) VALUES (?, ?, 'spend', ?, 'applepay', ?)",
                      (today, amount, merchant, time.time()),
                  )
          status = period_status()
          if not duplicate:
              threading.Thread(target=check_alerts, args=(amount, merchant), daemon=True).start()
          line = "%s %s. %s" % (merchant, money(amount), status_line(status))
          if status and status["left"] < 0:
              line = "\u26a0\ufe0f " + line
          return line


      class Handler(BaseHTTPRequestHandler):
          server_version = "Paydays"

          def log_message(self, fmt, *args):
              if os.environ.get("LOG_REQUESTS"):
                  super().log_message(fmt, *args)

          def authorised(self):
              if not PASSWORD:
                  return True
              header = self.headers.get("Authorization", "")
              if header.startswith("Basic "):
                  try:
                      _, _, given = base64.b64decode(header[6:]).decode("utf-8").partition(":")
                  except Exception:
                      return False
                  return hmac.compare_digest(given.encode(), PASSWORD.encode())
              return False

          def send(self, status, payload, content_type="application/json; charset=utf-8"):
              data = payload if isinstance(payload, bytes) else json.dumps(payload).encode()
              self.send_response(status)
              self.send_header("Content-Type", content_type)
              self.send_header("Content-Length", str(len(data)))
              self.send_header("Cache-Control", "no-store")
              self.send_header("X-Content-Type-Options", "nosniff")
              self.send_header("Referrer-Policy", "same-origin")
              self.end_headers()
              self.wfile.write(data)

          def route(self, method):
              parsed = urlparse(self.path)
              if parsed.path == "/hook/spend":
                  return self.hook(method, parsed)
              if not self.authorised():
                  self.send_response(401)
                  self.send_header("WWW-Authenticate", 'Basic realm="Paydays"')
                  self.send_header("Content-Length", "0")
                  self.end_headers()
                  return
              path = urlparse(self.path).path
              if method == "GET" and path in ("/", "/index.html"):
                  return self.send(200, PAGE.encode(), "text/html; charset=utf-8")
              if method == "GET" and path == "/health":
                  return self.send(200, {"status": "ok"})
              if method == "GET" and path == "/manifest.json":
                  return self.send(200, MANIFEST, "application/manifest+json")
              if not path.startswith("/api/"):
                  return self.send(404, {"error": "Not found"})
              body = {}
              if method in ("POST", "PUT"):
                  length = int(self.headers.get("Content-Length") or 0)
                  if length > 100_000:
                      return self.send(413, {"error": "Too much data"})
                  try:
                      body = json.loads(self.rfile.read(length) or b"{}")
                  except ValueError:
                      return self.send(400, {"error": "Not valid JSON"})
                  if not isinstance(body, dict):
                      return self.send(400, {"error": "Expected a JSON object"})
                  # Simple CSRF guard: only accept JSON from our own page.
                  if "application/json" not in (self.headers.get("Content-Type") or ""):
                      return self.send(415, {"error": "Send JSON"})
              try:
                  result = handle_api(method, path, body)
              except BadRequest as error:
                  return self.send(400, {"error": str(error)})
              except (ValueError, TypeError):
                  return self.send(400, {"error": "Something in that form isn't valid"})
              if result is None:
                  return self.send(404, {"error": "Not found"})
              self.send(200, result)

          def hook(self, method, parsed):
              """The Apple Pay Shortcut's link: /hook/spend?token=... Works without the page password, so the
              Shortcut can reach it; the token is what protects it. Answers with plain text for the notification."""
              if method != "POST":
                  return self.send(405, b"Use POST", "text/plain; charset=utf-8")
              length = int(self.headers.get("Content-Length") or 0)
              if length > 10_000:
                  return self.send(413, b"Too much data", "text/plain; charset=utf-8")
              raw = self.rfile.read(length) or b"{}"
              try:
                  body = json.loads(raw)
              except ValueError:
                  body = {key: values[0] for key, values in parse_qs(raw.decode("utf-8", "replace")).items()}
              if not isinstance(body, dict):
                  body = {}
              token = (parse_qs(parsed.query).get("token") or [""])[0] or str(body.get("token") or "")
              with db_lock:
                  expected = read_settings()["hook_token"]
              if not token or not hmac.compare_digest(token.encode(), expected.encode()):
                  return self.send(403, b"Wrong link: copy it again from Paydays > Pay & settings.", "text/plain; charset=utf-8")
              try:
                  line = handle_hook(body)
              except BadRequest as error:
                  line = str(error)
              self.send(200, line.encode("utf-8"), "text/plain; charset=utf-8")

          def do_GET(self):
              self.route("GET")

          def do_POST(self):
              self.route("POST")

          def do_PUT(self):
              self.route("PUT")

          def do_DELETE(self):
              self.route("DELETE")


      MANIFEST = {
          "name": "Paydays",
          "short_name": "Paydays",
          "start_url": "/",
          "display": "standalone",
          "background_color": "#0b1220",
          "theme_color": "#0b1220",
      }

      PAGE = r"""<!doctype html>
      <html lang="en-GB">
      <head>
      <meta charset="utf-8">
      <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
      <meta name="apple-mobile-web-app-capable" content="yes">
      <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
      <meta name="theme-color" content="#0b1220">
      <link rel="manifest" href="/manifest.json">
      <title>Paydays</title>
      <style>
      :root {
        --bg: #f4f6fa; --surface: #ffffff; --surface2: #eef1f6; --text: #0f172a; --muted: #5b6577;
        --line: #dde2ea; --accent: #0f9d8a; --accent-soft: #d8f3ee; --good: #15803d; --bad: #c2410c; --bad-soft: #fde8dc;
        --warn: #a16207; --radius: 14px;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #0b1220; --surface: #121b2d; --surface2: #18233a; --text: #e8edf6; --muted: #93a0b6;
          --line: #24314d; --accent: #3dd6c0; --accent-soft: #123a3a; --good: #4ade80; --bad: #fb923c; --bad-soft: #3b2216;
          --warn: #facc15;
        }
      }
      * { box-sizing: border-box; }
      html, body { margin: 0; background: var(--bg); color: var(--text); }
      body { font: 15px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; padding-bottom: calc(76px + env(safe-area-inset-bottom)); }
      header { position: sticky; top: 0; z-index: 5; background: var(--bg); padding: calc(10px + env(safe-area-inset-top)) 16px 8px; border-bottom: 1px solid var(--line); }
      h1 { font-size: 20px; margin: 0; }
      .monthnav { display: flex; align-items: center; justify-content: space-between; margin-top: 6px; }
      .monthnav strong { font-size: 17px; }
      button { font: inherit; color: inherit; background: var(--surface2); border: 1px solid var(--line); border-radius: 10px; padding: 8px 12px; cursor: pointer; }
      button.primary { background: var(--accent); color: #fff; border-color: transparent; font-weight: 600; }
      button.link { background: none; border: none; color: var(--accent); padding: 4px 6px; }
      button.danger { color: var(--bad); }
      main { padding: 12px 16px; max-width: 760px; margin: 0 auto; }
      .cards { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
      .card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 12px 14px; }
      .card .label { font-size: 12px; color: var(--muted); text-transform: uppercase; letter-spacing: .04em; }
      .card .value { font-size: 22px; font-weight: 700; margin-top: 2px; font-variant-numeric: tabular-nums; }
      .card .sub { font-size: 12px; color: var(--muted); }
      .good { color: var(--good); } .bad { color: var(--bad); } .muted { color: var(--muted); } .warn { color: var(--warn); }
      h2 { font-size: 15px; margin: 22px 0 8px; color: var(--muted); text-transform: uppercase; letter-spacing: .05em; }
      .list { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); overflow: hidden; }
      .row { display: flex; align-items: center; gap: 10px; padding: 11px 14px; border-top: 1px solid var(--line); }
      .row:first-child { border-top: none; }
      .row .grow { flex: 1; min-width: 0; }
      .row .name { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      .row .meta { font-size: 12px; color: var(--muted); }
      .amount { font-variant-numeric: tabular-nums; font-weight: 600; white-space: nowrap; }
      .payday { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); margin-bottom: 10px; overflow: hidden; }
      .payday-head { display: flex; align-items: center; gap: 10px; padding: 12px 14px; background: var(--accent-soft); }
      .payday-head .grow { flex: 1; }
      .payday-foot { display: flex; justify-content: space-between; padding: 10px 14px; border-top: 1px solid var(--line); font-weight: 600; }
      .tag { display: inline-block; font-size: 11px; padding: 1px 7px; border-radius: 999px; background: var(--surface2); color: var(--muted); margin-left: 6px; }
      .tag.edited { background: var(--accent-soft); color: var(--accent); }
      .note { background: var(--bad-soft); color: var(--bad); border-radius: 10px; padding: 10px 12px; margin: 10px 0; font-size: 14px; }
      .hint { color: var(--muted); font-size: 13px; margin: 6px 2px; }
      input[type=checkbox] { width: 22px; height: 22px; accent-color: var(--accent); }
      .paid .name, .paid .amount { text-decoration: line-through; color: var(--muted); }
      form.stack { display: grid; gap: 10px; background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 14px; }
      label.field { display: grid; gap: 4px; font-size: 13px; color: var(--muted); }
      input, select { font: inherit; color: var(--text); background: var(--surface2); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; width: 100%; }
      .two { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
      nav.tabs { position: fixed; left: 0; right: 0; bottom: 0; display: flex; background: var(--surface); border-top: 1px solid var(--line); padding-bottom: env(safe-area-inset-bottom); z-index: 10; }
      nav.tabs button { flex: 1; border: none; background: none; border-radius: 0; padding: 12px 0 10px; color: var(--muted); font-size: 13px; }
      nav.tabs button.on { color: var(--accent); font-weight: 700; }
      .timeline .row { padding: 8px 14px; }
      .timeline .date { width: 44px; color: var(--muted); font-size: 13px; font-variant-numeric: tabular-nums; }
      .empty { padding: 18px 14px; color: var(--muted); text-align: center; }
      dialog { border: 1px solid var(--line); border-radius: var(--radius); background: var(--surface); color: var(--text); width: min(420px, calc(100vw - 32px)); padding: 0; }
      dialog::backdrop { background: rgba(0,0,0,.45); }
      dialog form { border: none; }
      .toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(86px + env(safe-area-inset-bottom)); background: var(--text); color: var(--bg); padding: 8px 14px; border-radius: 999px; font-size: 14px; opacity: 0; transition: opacity .2s; pointer-events: none; z-index: 20; }
      .toast.show { opacity: 1; }
      </style>
      </head>
      <body>
      <header>
        <h1>Paydays</h1>
        <div class="monthnav" id="monthnav">
          <button id="prev" aria-label="Previous month">&#8249;</button>
          <strong id="monthLabel"></strong>
          <button id="next" aria-label="Next month">&#8250;</button>
        </div>
      </header>
      <main>
        <section id="tab-month"></section>
        <section id="tab-bills" hidden></section>
        <section id="tab-settings" hidden></section>
      </main>
      <nav class="tabs">
        <button data-tab="month" class="on">Month</button>
        <button data-tab="bills">Bills</button>
        <button data-tab="settings">Pay &amp; settings</button>
      </nav>
      <dialog id="dialog"></dialog>
      <div class="toast" id="toast"></div>
      <script>
      "use strict";
      var state = null;
      var tab = "month";
      var today = new Date();
      var viewYear = today.getFullYear();
      var viewMonth = today.getMonth(); // 0-11
      var DAY = 86400000;

      function el(tag, attrs, children) {
        var node = document.createElement(tag);
        attrs = attrs || {};
        Object.keys(attrs).forEach(function (key) {
          if (key === "text") node.textContent = attrs[key];
          else if (key === "class") node.className = attrs[key];
          else if (key.slice(0, 2) === "on") node.addEventListener(key.slice(2), attrs[key]);
          else if (attrs[key] !== null && attrs[key] !== undefined && attrs[key] !== false) node.setAttribute(key, attrs[key]);
        });
        (children || []).forEach(function (child) {
          if (child === null || child === undefined || child === false) return;
          node.appendChild(typeof child === "string" ? document.createTextNode(child) : child);
        });
        return node;
      }

      function money(pence) {
        var currency = (state && state.settings.currency) || "GBP";
        return new Intl.NumberFormat("en-GB", { style: "currency", currency: currency }).format((pence || 0) / 100);
      }
      function toPence(text) {
        var cleaned = String(text || "").replace(/[^0-9.\-]/g, "");
        if (!cleaned) return null;
        var value = Math.round(parseFloat(cleaned) * 100);
        return isNaN(value) ? null : value;
      }
      function poundsText(pence) { return pence === null || pence === undefined ? "" : (pence / 100).toFixed(2); }

      // Dates are handled as UTC midnights so clock changes never shift a day.
      function utc(y, m, d) { return Date.UTC(y, m, d); }
      function iso(t) { return new Date(t).toISOString().slice(0, 10); }
      function parseISO(s) { var p = s.split("-"); return utc(+p[0], +p[1] - 1, +p[2]); }
      function daysIn(y, m) { return new Date(Date.UTC(y, m + 1, 0)).getUTCDate(); }
      function monthKey(y, m) { return y + "-" + String(m + 1).padStart(2, "0"); }
      function dayLabel(t) { return new Date(t).toLocaleDateString("en-GB", { weekday: "short", day: "numeric", timeZone: "UTC" }); }
      function longLabel(t) { return new Date(t).toLocaleDateString("en-GB", { weekday: "long", day: "numeric", month: "long", timeZone: "UTC" }); }
      function shortDate(t) { return new Date(t).toLocaleDateString("en-GB", { day: "numeric", month: "short", timeZone: "UTC" }); }

      async function api(method, path, body) {
        var response = await fetch(path, {
          method: method,
          headers: body ? { "Content-Type": "application/json" } : {},
          body: body ? JSON.stringify(body) : undefined,
          credentials: "same-origin"
        });
        var data = await response.json().catch(function () { return {}; });
        if (!response.ok) { toast(data.error || "Something went wrong"); throw new Error(data.error); }
        state = data;
        render();
        return data;
      }

      var toastTimer = null;
      function toast(text) {
        var t = document.getElementById("toast");
        t.textContent = text; t.classList.add("show");
        clearTimeout(toastTimer); toastTimer = setTimeout(function () { t.classList.remove("show"); }, 2200);
      }

      // ---------- Pay and bill calculations ----------

      function stepDays() {
        return { weekly: 7, fortnightly: 14, fourweekly: 28 }[state.settings.pay_frequency] || 0;
      }

      // Paydays falling in [from, to] (UTC ms, inclusive).
      function paydaysBetween(from, to) {
        var s = state.settings, out = [];
        if (!s.pay_anchor) return out;
        var anchor = parseISO(s.pay_anchor);
        if (s.pay_frequency === "monthly") {
          var anchorDay = new Date(anchor).getUTCDate();
          var d = new Date(from), y = d.getUTCFullYear(), m = d.getUTCMonth();
          for (var i = 0; i < 24; i++) {
            var t = utc(y, m, Math.min(anchorDay, daysIn(y, m)));
            if (t > to) break;
            if (t >= from) out.push(t);
            m++; if (m > 11) { m = 0; y++; }
          }
          return out;
        }
        var step = stepDays() * DAY;
        var k = Math.ceil((from - anchor) / step);
        for (var t2 = anchor + k * step; t2 <= to; t2 += step) out.push(t2);
        return out;
      }

      function payFor(t) {
        var key = iso(t);
        var actual = state.pays.find(function (p) { return p.kind === "pay" && p.date === key; });
        return actual ? { amount: actual.amount, edited: true } : { amount: state.settings.pay_amount, edited: false };
      }

      // Every bill due in [from, to], with its date.
      function billsBetween(from, to) {
        var out = [];
        var d = new Date(from), y = d.getUTCFullYear(), m = d.getUTCMonth();
        for (var i = 0; i < 24; i++) {
          var start = utc(y, m, 1);
          if (start > to) break;
          state.bills.forEach(function (bill) {
            if (!bill.active) return;
            var t = utc(y, m, Math.min(bill.day, daysIn(y, m)));
            if (t >= from && t <= to) out.push({ bill: bill, date: t, month: monthKey(y, m) });
          });
          m++; if (m > 11) { m = 0; y++; }
        }
        return out.sort(function (a, b) { return a.date - b.date || a.bill.name.localeCompare(b.bill.name); });
      }

      var PAYS_PER_YEAR = { weekly: 365.25 / 7, fortnightly: 365.25 / 14, fourweekly: 365.25 / 28, monthly: 12 };
      var WEEKS_PER_YEAR = 365.25 / 7;

      function monthlyBillTotal() {
        return state.bills.filter(function (b) { return b.active; }).reduce(function (s, b) { return s + b.amount; }, 0);
      }

      // Steady spending money per week: a year of pay, minus a year of bills and savings, spread over 52 weeks.
      // Big bills (like rent) are smoothed out, so the weeks they land in don't leave you short.
      function weeklyAllowance() {
        var s = state.settings;
        var yearlyPay = s.pay_amount * (PAYS_PER_YEAR[s.pay_frequency] || 0);
        var yearlyOut = (monthlyBillTotal() + (s.savings || 0)) * 12;
        return Math.floor((yearlyPay - yearlyOut) / WEEKS_PER_YEAR);
      }

      // The pay period today falls in: from the last payday up to the day before the next one.
      function currentPeriod() {
        if (!state.settings.pay_anchor) return null;
        var now = utc(today.getFullYear(), today.getMonth(), today.getDate());
        var recent = paydaysBetween(now - 40 * DAY, now);
        var start = recent[recent.length - 1];
        var next = paydaysBetween(now + DAY, now + 40 * DAY)[0];
        if (start === undefined || next === undefined) return null;
        return { start: start, end: next - DAY, next: next, now: now };
      }

      // The saving plan: each pay saves towards whichever bill comes out next.
      // A bill is saved for by the pays from when the previous bill of a similar size (at least half as big) went out,
      // up to the day before it's due, split evenly. E.g. rent £700 on the 5th and StepChange £494 on the 20th, paid
      // weekly: pays from the 5th to the 19th save for StepChange, pays from the 20th to the 4th save for rent. Small
      // bills don't break that up; they're saved for alongside. If no pay falls in that gap, saving starts from the
      // similar-sized bill before that (at the latest, the same bill's previous due date).
      // Returns { "<payday ms>": [{ bill, due, amount }] }.
      var planCache = null;
      function savingPlan() {
        if (planCache) return planCache;
        var plan = {};
        if (!state.settings.pay_anchor) return (planCache = plan);
        var from = utc(viewYear, viewMonth, 1) - 120 * DAY, to = utc(viewYear, viewMonth, 1) + 160 * DAY;
        var occurrences = billsBetween(from, to);
        var pays = paydaysBetween(from - 40 * DAY, to);
        occurrences.forEach(function (o, i) {
          var windowPays = [];
          for (var j = i - 1; j >= 0; j--) {
            var prev = occurrences[j];
            if (prev.date >= o.date || prev.bill.amount * 2 < o.bill.amount) continue;
            var start = prev.date;
            windowPays = pays.filter(function (t) { return t >= start && t < o.date; });
            if (windowPays.length) break;
          }
          if (!windowPays.length) return; // too close to the start of the range to know; outside the months shown
          var share = Math.floor(o.bill.amount / windowPays.length), extra = o.bill.amount - share * windowPays.length;
          windowPays.forEach(function (t, k) {
            // Any leftover pence go on the earliest pays, so the money is there in time.
            (plan[t] = plan[t] || []).push({ bill: o.bill, due: o.date, month: o.month, amount: share + (k < extra ? 1 : 0) });
          });
        });
        Object.keys(plan).forEach(function (t) { plan[t].sort(function (a, b) { return a.due - b.due; }); });
        return (planCache = plan);
      }

      function savingsPerPay() {
        var per = PAYS_PER_YEAR[state.settings.pay_frequency] || 0;
        return per && state.settings.savings ? Math.ceil(state.settings.savings * 12 / per) : 0;
      }

      // What a pay has to put aside (bills plus the savings goal), and what's left to spend from it.
      function payBreakdown(t) {
        var items = savingPlan()[t] || [];
        var aside = items.reduce(function (s, x) { return s + x.amount; }, 0) + savingsPerPay();
        var pay = payFor(t);
        return { pay: pay, items: items, aside: aside, spend: pay.amount - aside };
      }

      // What the plan says should already be put aside on the 1st, for bills due this month or later.
      function plannedPotAt(monthStart) {
        var plan = savingPlan(), total = 0;
        Object.keys(plan).forEach(function (key) {
          if (+key >= monthStart) return;
          plan[key].forEach(function (x) { if (x.due >= monthStart) total += x.amount; });
        });
        return total;
      }

      function spendsBetween(from, to) {
        return state.pays.filter(function (p) {
          if (p.kind !== "spend") return false;
          var t = parseISO(p.date);
          return t >= from && t <= to;
        }).sort(function (a, b) { return b.date.localeCompare(a.date) || b.id - a.id; });
      }

      function isPaid(billId, month) {
        return state.paid.some(function (p) { return p.bill_id === billId && p.month === month; });
      }

      // ---------- Month tab ----------

      function renderMonth() {
        var root = document.getElementById("tab-month");
        root.innerHTML = "";
        var y = viewYear, m = viewMonth, key = monthKey(y, m);
        var first = utc(y, m, 1), last = utc(y, m, daysIn(y, m));

        if (!state.settings.pay_anchor || !state.settings.pay_amount) {
          root.appendChild(el("div", { class: "note" }, [
            "Start in ", el("b", { text: "Pay & settings" }), ": enter your usual pay and the date of one recent payday."
          ]));
        }

        if (state.settings.pay_anchor && state.settings.pay_amount) renderSpending(root);

        var paydays = paydaysBetween(first, last);
        var extras = state.pays.filter(function (p) { return p.kind === "extra" && p.date.slice(0, 7) === key; });
        var spends = state.pays.filter(function (p) { return p.kind === "spend" && p.date.slice(0, 7) === key; });
        var monthBills = billsBetween(first, last);
        var payTotal = paydays.reduce(function (sum, t) { return sum + payFor(t).amount; }, 0);
        var extraTotal = extras.reduce(function (sum, p) { return sum + p.amount; }, 0);
        var billTotal = monthBills.reduce(function (sum, b) { return sum + b.bill.amount; }, 0);
        var left = payTotal + extraTotal - billTotal;
        var unpaid = monthBills.filter(function (b) { return !isPaid(b.bill.id, b.month); })
          .reduce(function (sum, b) { return sum + b.bill.amount; }, 0);

        root.appendChild(el("h2", { text: "This month" }));
        var summary = el("div", { class: "cards" }, [
          card("Pay this month", money(payTotal + extraTotal), paydays.length + " payday" + (paydays.length === 1 ? "" : "s") + (extraTotal ? " + extra" : "")),
          card("Bills this month", money(billTotal), monthBills.length + " payment" + (monthBills.length === 1 ? "" : "s")),
          card("Left over", money(left), left < 0 ? "Bills are more than pay" : "after every bill", left < 0 ? "bad" : "good"),
          card("Still to pay", money(unpaid), unpaid ? "not ticked off yet" : "all bills ticked off", unpaid ? "" : "good")
        ]);
        root.appendChild(summary);

        // Each payday: what to put aside, which bill it's for, and what's left to spend.
        root.appendChild(el("h2", { text: "Each payday" }));
        if (!paydays.length) {
          root.appendChild(el("div", { class: "list" }, [el("div", { class: "empty", text: "No paydays this month yet. Set up your pay in Pay & settings." })]));
        } else {
          root.appendChild(el("p", { class: "hint", text: "Each pay saves towards the next big bill that's due (smaller bills alongside), so the money is already there when it goes out." }));
          paydays.forEach(function (t) {
            var b = payBreakdown(t);
            var nextPay = paydaysBetween(t + DAY, t + 62 * DAY)[0];
            var until = nextPay ? nextPay - DAY : t + stepDays() * DAY - DAY;
            var goingOut = billsBetween(t, until);
            var box = el("div", { class: "payday" }, [
              el("div", { class: "payday-head" }, [
                el("div", { class: "grow" }, [
                  el("div", { class: "name" }, [longLabel(t), b.pay.edited ? el("span", { class: "tag edited", text: "actual" }) : el("span", { class: "tag", text: "usual" })]),
                  el("div", { class: "meta", text: "Put aside " + money(b.aside) })
                ]),
                el("span", { class: "amount", text: money(b.pay.amount) }),
                el("button", { class: "link", text: "Edit", onclick: function () { editPay(t); } })
              ])
            ]);
            var list = el("div", {});
            if (!b.items.length && !savingsPerPay()) list.appendChild(el("div", { class: "empty", text: "Nothing to put aside from this pay." }));
            b.items.forEach(function (x) {
              list.appendChild(el("div", { class: "row" }, [
                el("div", { class: "grow" }, [
                  el("div", { class: "name", text: "Save for " + x.bill.name }),
                  el("div", { class: "meta", text: money(x.bill.amount) + " due " + longLabel(x.due) })
                ]),
                el("span", { class: "amount", text: money(x.amount) })
              ]));
            });
            if (savingsPerPay()) {
              list.appendChild(el("div", { class: "row" }, [
                el("div", { class: "grow" }, [el("div", { class: "name", text: "Savings" }), el("div", { class: "meta", text: money(state.settings.savings) + " a month" })]),
                el("span", { class: "amount", text: money(savingsPerPay()) })
              ]));
            }
            if (goingOut.length) {
              list.appendChild(el("div", { class: "row" }, [
                el("div", { class: "grow" }, [el("div", { class: "meta", text: "Going out before the next payday (from money already put aside): " +
                  goingOut.map(function (o) { return o.bill.name + " " + money(o.bill.amount) + " on " + dayLabel(o.date); }).join(", ") })])
              ]));
            }
            box.appendChild(list);
            box.appendChild(el("div", { class: "payday-foot" }, [
              el("span", { text: "Left to spend from this pay" }),
              el("span", { class: "amount " + (b.spend < 0 ? "bad" : "good"), text: money(b.spend) })
            ]));
            root.appendChild(box);
          });
        }

        // Running balance through the month.
        var openingSet = Object.prototype.hasOwnProperty.call(state.months, key);
        var opening = openingSet ? state.months[key] : plannedPotAt(first);
        root.appendChild(el("h2", { text: "Day by day" }));
        var events = [];
        paydays.forEach(function (t) { events.push({ date: t, order: 0, name: "Pay", amount: payFor(t).amount }); });
        extras.forEach(function (p) { events.push({ date: parseISO(p.date), order: 1, name: p.note, amount: p.amount, extra: p }); });
        spends.forEach(function (p) { events.push({ date: parseISO(p.date), order: 3, name: "Spent" + (p.note ? ": " + p.note : ""), amount: -p.amount }); });
        monthBills.forEach(function (b) { events.push({ date: b.date, order: 2, name: b.bill.name, amount: -b.bill.amount }); });
        events.sort(function (a, b) { return a.date - b.date || a.order - b.order; });
        var balance = opening, lowest = opening, lowestDate = null;
        var timeline = el("div", { class: "list timeline" }, [
          el("div", { class: "row" }, [
            el("span", { class: "date", text: "1st" }),
            el("div", { class: "grow" }, [el("div", { class: "name", text: "Start balance" }), el("div", { class: "meta", text: openingSet ? "In the bank on the 1st" : "Estimate: what your saving plan has put aside. Tap Edit to enter your real balance." })]),
            el("span", { class: "amount", text: money(opening) }),
            el("button", { class: "link", text: "Edit", onclick: editOpening })
          ])
        ]);
        events.forEach(function (e) {
          balance += e.amount;
          if (balance < lowest) { lowest = balance; lowestDate = e.date; }
          timeline.appendChild(el("div", { class: "row" }, [
            el("span", { class: "date", text: String(new Date(e.date).getUTCDate()) }),
            el("div", { class: "grow" }, [
              el("div", { class: "name", text: e.name }),
              el("div", { class: "meta " + (balance < 0 ? "bad" : ""), text: "Balance " + money(balance) })
            ]),
            el("span", { class: "amount " + (e.amount >= 0 ? "good" : ""), text: (e.amount >= 0 ? "+" : "−") + money(Math.abs(e.amount)) }),
            e.extra ? el("button", { class: "link danger", text: "✕", "aria-label": "Remove", onclick: function () { if (confirm("Remove " + e.name + "?")) api("DELETE", "/api/extra/" + e.extra.id); } }) : null
          ]));
        });
        if (lowest < 0) {
          root.insertBefore(el("div", { class: "note", text: "Heads up: your balance drops to " + money(lowest) + " on " + longLabel(lowestDate) +
            ". A bill comes out before enough pay has gone in. If you've been paid already, check the start balance under Day by day." }), summary);
        }
        root.appendChild(timeline);
        root.appendChild(el("div", { style: "margin-top:10px" }, [el("button", { text: "+ Add extra money in or out", onclick: addExtra })]));

        // Tick-off list.
        root.appendChild(el("h2", { text: "Tick off bills as they go out" }));
        var checklist = el("div", { class: "list" });
        if (!monthBills.length) checklist.appendChild(el("div", { class: "empty", text: "No bills yet. Add them in the Bills tab." }));
        monthBills.forEach(function (b) {
          var paid = isPaid(b.bill.id, b.month);
          checklist.appendChild(el("label", { class: "row" + (paid ? " paid" : "") }, [
            el("input", { type: "checkbox", checked: paid ? "checked" : null, onchange: function (ev) {
              api("PUT", "/api/paid", { bill_id: b.bill.id, month: b.month, paid: ev.target.checked });
            } }),
            el("div", { class: "grow" }, [
              el("div", { class: "name", text: b.bill.name }),
              el("div", { class: "meta", text: dayLabel(b.date) })
            ]),
            el("span", { class: "amount", text: money(b.bill.amount) })
          ]));
        });
        root.appendChild(checklist);
      }

      function renderSpending(root) {
        var weekly = weeklyAllowance();
        var period = currentPeriod();
        root.appendChild(el("h2", { text: "Safe to spend" }));
        if (weekly <= 0) {
          root.appendChild(el("div", { class: "note", text: "Your bills" + (state.settings.savings ? " and savings" : "") +
            " add up to more than your pay over a year, so there's nothing safe to spend. Look at the Bills tab for something to cut or pause." }));
          return;
        }
        var cards = [card("Average per week", money(weekly), "about " + money(Math.floor(weekly / 7)) + " a day, across the year", "good")];
        if (period) {
          var allowance = Math.max(0, payBreakdown(period.start).spend);
          var spent = spendsBetween(period.start, period.end).reduce(function (s, p) { return s + p.amount; }, 0);
          var left = allowance - spent;
          var daysLeft = Math.round((period.end - period.now) / DAY) + 1;
          var perDay = left > 0 ? Math.floor(left / daysLeft) : 0;
          cards.push(card("Left until payday", money(left),
            left < 0 ? "over by " + money(-left) : money(perDay) + " a day for " + daysLeft + " day" + (daysLeft === 1 ? "" : "s"),
            left < 0 ? "bad" : (perDay < weekly / 14 ? "warn" : "good")));
          root.appendChild(el("div", { class: "cards" }, cards));
          var spentList = spendsBetween(period.start, period.end);
          var box = el("div", { class: "list", style: "margin-top:10px" }, [
            el("div", { class: "row" }, [
              el("div", { class: "grow" }, [
                el("div", { class: "name", text: "This pay period: " + shortDate(period.start) + " – " + shortDate(period.end) }),
                el("div", { class: "meta", text: "Spent " + money(spent) + " of " + money(allowance) + " (this pay after putting " + money(payBreakdown(period.start).aside) + " aside) · next payday " + longLabel(period.next) })
              ]),
              el("button", { class: "primary", text: "+ Spent", onclick: addSpend })
            ])
          ]);
          var bar = el("div", { style: "height:8px;background:var(--surface2);margin:0 14px 12px;border-radius:99px;overflow:hidden" }, [
            el("div", { style: "height:100%;width:" + Math.min(100, Math.round(spent * 100 / Math.max(1, allowance))) + "%;background:" + (left < 0 ? "var(--bad)" : "var(--accent)") })
          ]);
          box.appendChild(bar);
          spentList.slice(0, 8).forEach(function (p) {
            box.appendChild(el("div", { class: "row" }, [
              el("div", { class: "grow" }, [
                el("div", { class: "name" }, [p.note || "Spending", p.source === "applepay" ? el("span", { class: "tag", text: "Apple Pay" }) : null]),
                el("div", { class: "meta", text: dayLabel(parseISO(p.date)) })
              ]),
              el("span", { class: "amount", text: money(p.amount) }),
              el("button", { class: "link danger", text: "✕", "aria-label": "Remove", onclick: function () {
                if (confirm("Remove " + money(p.amount) + (p.note ? " (" + p.note + ")" : "") + "?")) api("DELETE", "/api/spend/" + p.id);
              } })
            ]));
          });
          root.appendChild(box);
        } else {
          root.appendChild(el("div", { class: "cards" }, cards));
        }
        root.appendChild(el("p", { class: "hint", text: "Left until payday is what this pay leaves after putting money aside for your next bills (see Each payday below). " +
          "Some pays put more aside than others, depending on which bill is next; the average works out at " + money(billsPerPay()) + " a pay." }));
      }

      function billsPerPay() {
        var per = PAYS_PER_YEAR[state.settings.pay_frequency] || 0;
        return per ? Math.ceil((monthlyBillTotal() + (state.settings.savings || 0)) * 12 / per) : 0;
      }

      function addSpend() {
        var amount = el("input", { inputmode: "decimal", placeholder: "0.00", required: "required" });
        var note = el("input", { placeholder: "Optional, e.g. Food shop, petrol" });
        var when = el("input", { type: "date", value: iso(utc(today.getFullYear(), today.getMonth(), today.getDate())) });
        openDialog("Money spent", [
          el("div", { class: "two" }, [el("label", { class: "field" }, ["Amount (£)", amount]), el("label", { class: "field" }, ["Date", when])]),
          el("label", { class: "field" }, ["On what", note])
        ], function () {
          var pence = toPence(amount.value);
          if (!pence || !when.value) { toast("Enter an amount"); return false; }
          return api("POST", "/api/spend", { date: when.value, amount: Math.abs(pence), note: note.value });
        });
        setTimeout(function () { amount.focus(); }, 50);
      }

      function card(label, value, sub, cls) {
        return el("div", { class: "card" }, [
          el("div", { class: "label", text: label }),
          el("div", { class: "value " + (cls || ""), text: value }),
          el("div", { class: "sub", text: sub })
        ]);
      }

      // ---------- Bills tab ----------

      function renderBills() {
        var root = document.getElementById("tab-bills");
        root.innerHTML = "";
        var total = monthlyBillTotal();
        var perPay = billsPerPay();
        root.appendChild(el("div", { class: "cards" }, [
          card("Monthly bills", money(total), state.bills.length + " payment" + (state.bills.length === 1 ? "" : "s")),
          card("Put aside each pay", money(perPay), "on average, to cover them")
        ]));
        root.appendChild(el("h2", { text: "Monthly payments" }));
        var list = el("div", { class: "list" });
        if (!state.bills.length) list.appendChild(el("div", { class: "empty", text: "No bills yet." }));
        state.bills.forEach(function (bill) {
          list.appendChild(el("div", { class: "row" }, [
            el("div", { class: "grow" }, [
              el("div", { class: "name", text: bill.name + (bill.active ? "" : " (paused)") }),
              el("div", { class: "meta", text: "Day " + bill.day + " of each month" + (bill.category ? " · " + bill.category : "") })
            ]),
            el("span", { class: "amount " + (bill.active ? "" : "muted"), text: money(bill.amount) }),
            el("button", { class: "link", text: "Edit", onclick: function () { editBill(bill); } })
          ]));
        });
        root.appendChild(list);
        root.appendChild(el("div", { style: "margin-top:12px" }, [el("button", { class: "primary", text: "+ Add a monthly payment", onclick: function () { editBill(null); } })]));
        root.appendChild(el("p", { class: "hint", text: "Bills on the 29th, 30th or 31st come out on the last day of shorter months." }));
      }

      // ---------- Settings tab ----------

      function renderSettings() {
        var root = document.getElementById("tab-settings");
        root.innerHTML = "";
        var s = state.settings;
        var amount = el("input", { inputmode: "decimal", value: poundsText(s.pay_amount), placeholder: "e.g. 450.00" });
        var freq = el("select", {}, [
          option("weekly", "Every week", s.pay_frequency), option("fortnightly", "Every two weeks", s.pay_frequency),
          option("fourweekly", "Every four weeks", s.pay_frequency), option("monthly", "Once a month", s.pay_frequency)
        ]);
        var anchor = el("input", { type: "date", value: s.pay_anchor || "" });
