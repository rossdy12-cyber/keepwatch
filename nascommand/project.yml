# XcodeGen project description. The "Build NAS Command IPA" workflow turns this into
# NASCommand.xcodeproj with `xcodegen generate`.
name: NASCommand
options:
  bundleIdPrefix: app.nascommand
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.0"
    SWIFT_STRICT_CONCURRENCY: minimal
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"

targets:
  NASCommand:
    type: application
    platform: iOS
    sources:
      - path: NASCommand
      - path: Shared
    dependencies:
      - target: NASCommandWidget
    settings:
      base:
        PRODUCT_NAME: NAS Command
        PRODUCT_BUNDLE_IDENTIFIER: app.nascommand.client
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: ""
        CODE_SIGNING_REQUIRED: "NO"
        CODE_SIGNING_ALLOWED: "NO"
        DEVELOPMENT_TEAM: ""
        CODE_SIGN_ENTITLEMENTS: NASCommand.entitlements
    info:
      path: NASCommand/Info.plist
      properties:
        CFBundleDisplayName: NAS Command
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSRequiresIPhoneOS: true
        ITSAppUsesNonExemptEncryption: false
        UIUserInterfaceStyle: Dark
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
        NSLocalNetworkUsageDescription: NAS Command connects to your TrueNAS server on your network.
        # Background checks for pool/app problems, posted as local notifications.
        UIBackgroundModes:
          - fetch
        BGTaskSchedulerPermittedIdentifiers:
          - app.nascommand.refresh

  NASCommandWidget:
    type: app-extension
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: NASCommandWidget
      - path: Shared
    settings:
      base:
        PRODUCT_NAME: NASCommandWidget
        PRODUCT_BUNDLE_IDENTIFIER: app.nascommand.client.widget
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: ""
        CODE_SIGNING_REQUIRED: "NO"
        CODE_SIGNING_ALLOWED: "NO"
        DEVELOPMENT_TEAM: ""
        SKIP_INSTALL: "YES"
        CODE_SIGN_ENTITLEMENTS: NASCommandWidget.entitlements
    info:
      path: NASCommandWidget/Info.plist
      properties:
        CFBundleDisplayName: NAS Command
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
