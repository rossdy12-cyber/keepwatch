name: OmniContainer
options:
  bundleIdPrefix: com.ross
  deploymentTarget:
    iOS: "16.0"
  xcodeVersion: "16.0"
  generateEmptyDirectories: true

settings:
  base:
    SWIFT_VERSION: "5.9"
    TARGETED_DEVICE_FAMILY: "1,2"
    SUPPORTS_MACCATALYST: NO
    CODE_SIGNING_ALLOWED: NO
    CODE_SIGNING_REQUIRED: NO
    CODE_SIGN_IDENTITY: ""
    DEVELOPMENT_TEAM: ""
    ENABLE_USER_SCRIPT_SANDBOXING: YES

targets:
  OmniContainer:
    type: application
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - path: OmniContainer
        excludes:
          - "**/*.md"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ross.omnicontainer
        PRODUCT_NAME: OmniContainer
        INFOPLIST_KEY_CFBundleDisplayName: "OmniContainer"
        MARKETING_VERSION: "2.1.0"
        CURRENT_PROJECT_VERSION: "2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UILaunchScreen_BackgroundColor: LaunchBackground
        INFOPLIST_KEY_UIStatusBarStyle: UIStatusBarStyleLightContent
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: "UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
    info:
      path: OmniContainer/Info.plist
      properties:
        CFBundleDisplayName: "OmniContainer"
        CFBundleURLTypes:
          - CFBundleTypeRole: Editor
            CFBundleURLName: com.ross.omnicontainer
            CFBundleURLSchemes:
              - omnicontainer
        LSApplicationQueriesSchemes:
          - livecontainer
          - sidestore
          - altstore
        UILaunchScreen:
          UIColorName: LaunchBackground
        UISupportsDocumentBrowser: true
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
        UIBackgroundModes:
          - audio
          - fetch
          - processing
        NSLocalNetworkUsageDescription: "OmniContainer runs all your apps simultaneously in memory and serves Home Screen ClipApp profiles."
