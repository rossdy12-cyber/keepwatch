name: OmniContainer
options:
  bundleIdPrefix: com.ross
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "16.0"
  generateEmptyDirectories: true

settings:
  base:
    SWIFT_VERSION: "5.0"
    SWIFT_STRICT_CONCURRENCY: minimal
    SUPPORTS_MACCATALYST: NO
    # Automatic (free) signing for local device builds; CI forces unsigned on the xcodebuild command line.
    CODE_SIGN_STYLE: Automatic
    ENABLE_USER_SCRIPT_SANDBOXING: YES

targets:
  OmniContainer:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: OmniContainer
        excludes:
          - "**/*.md"
    dependencies:
      - target: OmniWatch
        embed: true
    settings:
      base:
        TARGETED_DEVICE_FAMILY: "1,2"
        PRODUCT_BUNDLE_IDENTIFIER: com.rossd.jarvishost
        PRODUCT_NAME: OmniContainer
        INFOPLIST_KEY_CFBundleDisplayName: "OmniContainer"
        MARKETING_VERSION: "2.1.0"
        CURRENT_PROJECT_VERSION: "2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UILaunchScreen_BackgroundColor: LaunchBackground
        INFOPLIST_KEY_UIStatusBarStyle: UIStatusBarStyleLightContent
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: "UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
    info:
      path: OmniContainer/Info.plist
      properties:
        CFBundleDisplayName: "OmniContainer"
        CFBundleURLTypes:
          - CFBundleTypeRole: Editor
            CFBundleURLName: com.ross.omnicontainer
            CFBundleURLSchemes:
              - omnicontainer
        LSApplicationQueriesSchemes:
          - livecontainer
          - sidestore
          - altstore
        UILaunchScreen:
          UIColorName: LaunchBackground
        UISupportsDocumentBrowser: true
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
        UIBackgroundModes:
          - audio
          - fetch
          - processing
        NSLocalNetworkUsageDescription: "OmniContainer runs all your apps simultaneously in memory and serves Home Screen ClipApp profiles."

  OmniWatch:
    type: application
    platform: watchOS
    deploymentTarget: "10.0"
    sources:
      - path: OmniWatch
    dependencies:
      - target: OmniWatchWidgets
        embed: true
    settings:
      base:
        TARGETED_DEVICE_FAMILY: "4"
        PRODUCT_BUNDLE_IDENTIFIER: com.rossd.jarvishost.watchkitapp
        PRODUCT_NAME: OmniWatch
        MARKETING_VERSION: "2.1.0"
        CURRENT_PROJECT_VERSION: "2"
        GENERATE_INFOPLIST_FILE: YES
    info:
      path: OmniWatch/Info.plist
      properties:
        CFBundleDisplayName: "J.A.R.V.I.S."
        WKApplication: true
        WKCompanionAppBundleIdentifier: com.rossd.jarvishost
        WKRunsIndependentlyOfCompanionApp: true
        WKBackgroundModes:
          - self-care
          - mindfulness
          - workout-processing
        NSHealthShareUsageDescription: "J.A.R.V.I.S. shows your live heart rate and steps on its Watch faces."
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true

  OmniWatchWidgets:
    type: app-extension
    platform: watchOS
    deploymentTarget: "10.0"
    sources:
      - path: OmniWatchWidgets
    settings:
      base:
        TARGETED_DEVICE_FAMILY: "4"
        PRODUCT_BUNDLE_IDENTIFIER: com.rossd.jarvishost.watchkitapp.widgets
        PRODUCT_NAME: OmniWatchWidgets
        MARKETING_VERSION: "2.1.0"
        CURRENT_PROJECT_VERSION: "2"
        GENERATE_INFOPLIST_FILE: YES
    info:
      path: OmniWatchWidgets/Info.plist
      properties:
        CFBundleDisplayName: "J.A.R.V.I.S. Widgets"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
