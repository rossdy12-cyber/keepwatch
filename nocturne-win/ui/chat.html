<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Nocturne Chat</title>
<style>
  :root { --bg:#0b0608; --bg2:#1a0a0e; --panel:#1c1116; --accent:#b01030; --accent2:#e04050; --text:#ede3e6; --muted:#8a7076; }
  * { box-sizing:border-box; }
  html,body { margin:0; height:100%; }
  body { background:linear-gradient(#0b0608,#1a0a0e,#070406); color:var(--text);
    font-family:Georgia,'Times New Roman',serif; display:flex; flex-direction:column; height:100vh; }
  header { padding:14px 18px; display:flex; align-items:center; gap:12px; border-bottom:1px solid rgba(176,16,48,.3); }
  header h1 { font-size:20px; margin:0; flex:1; }
  header .dot { font-size:11px; color:var(--muted); letter-spacing:2px; }
  button { font-family:inherit; cursor:pointer; border:1px solid rgba(176,16,48,.4); background:var(--panel);
    color:var(--text); border-radius:10px; padding:8px 12px; }
  button.accent { background:var(--accent); border-color:transparent; color:#fff; }
  button.icon { border-radius:50%; width:40px; height:40px; font-size:16px; }
  #log { flex:1; overflow-y:auto; padding:16px; display:flex; flex-direction:column; gap:8px; }
  .row { display:flex; }
  .row.me { justify-content:flex-end; }
  .bubble { max-width:70%; padding:8px 12px; border-radius:16px; background:var(--panel); white-space:pre-wrap; word-wrap:break-word; }
  .row.me .bubble { background:var(--accent); color:#fff; }
  .who { font-size:11px; color:var(--accent2); margin:0 0 2px 4px; }
  footer { padding:12px 16px; display:flex; gap:10px; border-top:1px solid rgba(176,16,48,.3); background:#070406; }
  #draft { flex:1; resize:none; height:44px; padding:10px; border-radius:12px; border:1px solid rgba(255,255,255,.1);
    background:var(--panel); color:var(--text); font-family:inherit; font-size:15px; }
  /* settings */
  #settings { margin:auto; max-width:420px; width:100%; padding:28px; }
  #settings h1 { font-size:26px; text-align:center; }
  label { display:block; font-size:12px; color:var(--muted); margin:12px 0 4px; letter-spacing:1px; }
  input { width:100%; padding:10px; border-radius:8px; border:1px solid rgba(255,255,255,.1);
    background:#0b0608; color:var(--text); font-family:inherit; font-size:15px; }
  .hint { font-size:12px; color:var(--muted); margin-top:16px; line-height:1.5; }
  .hidden { display:none; }
  #status { font-size:12px; color:var(--muted); padding:0 16px; height:16px; }
</style>
</head>
<body>

<div id="settings" class="hidden">
  <h1>Nocturne</h1>
  <label>Relay URL</label><input id="s_relay" placeholder="jarvis.nas-server.co.uk">
  <label>Token (optional)</label><input id="s_token">
  <label>Your name</label><input id="s_name" placeholder="Lauren">
  <label>Their name</label><input id="s_partner" placeholder="Ross">
  <label>Private room id</label><input id="s_room" placeholder="home">
  <div style="margin-top:18px"><button class="accent" style="width:100%;padding:12px" onclick="saveSettings()">Enter the dark</button></div>
  <div class="hint">Both of you set the same Relay URL, token and room id, with different names. Messages and calls run on your own homelab.</div>
</div>

<div id="chat" class="hidden" style="flex:1; display:flex; flex-direction:column; min-height:0;">
  <header>
    <h1 id="title">Messages</h1>
    <span class="dot">NOCTURNE</span>
    <button class="icon" title="Video call" onclick="startCall()">&#127909;</button>
    <button class="icon" title="Settings" onclick="showSettings()">&#9881;</button>
  </header>
  <div id="log"></div>
  <div id="status"></div>
  <footer>
    <textarea id="draft" placeholder="Speak into the dark…" onkeydown="if(event.key==='Enter'&&!event.shiftKey){event.preventDefault();send();}"></textarea>
    <button class="accent" onclick="send()">Send</button>
  </footer>
</div>

<script>
let cfg = {}, lastID = 0, timer = null, seenByName = '';

async function api(path, opts){ return fetch(path, opts); }
function el(id){ return document.getElementById(id); }

async function load(){
  cfg = await (await api('/api/config')).json();
  if(!cfg.configured){ showSettings(); return; }
  seenByName = cfg.displayName || 'Me';
  el('title').textContent = cfg.partnerName || 'Messages';
  el('settings').classList.add('hidden');
  el('chat').classList.remove('hidden');
  if (window.Notification && Notification.permission === 'default') Notification.requestPermission();
  lastID = 0; el('log').innerHTML = '';
  poll();
  clearInterval(timer); timer = setInterval(poll, 3000);
}

function showSettings(){
  el('s_relay').value = cfg.relayURL || '';
  el('s_token').value = cfg.token || '';
  el('s_name').value = cfg.displayName || '';
  el('s_partner').value = cfg.partnerName || '';
  el('s_room').value = cfg.room || 'home';
  el('chat').classList.add('hidden');
  el('settings').classList.remove('hidden');
}

async function saveSettings(){
  const body = {
    relayURL: el('s_relay').value, token: el('s_token').value,
    displayName: el('s_name').value || 'Me', partnerName: el('s_partner').value,
    room: el('s_room').value || 'home'
  };
  await api('/api/config', {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify(body)});
  await load();
}

async function poll(){
  try {
    const r = await api('/api/messages?since=' + lastID);
    if(!r.ok){ el('status').textContent = 'Relay unreachable'; return; }
    const msgs = await r.json();
    el('status').textContent = '';
    for(const m of msgs){
      addBubble(m);
      lastID = Math.max(lastID, m.id);
      if(m.sender !== seenByName && document.hidden && window.Notification && Notification.permission === 'granted'){
        const n = new Notification(m.sender, { body: m.text });
        n.onclick = () => window.focus();
      }
    }
  } catch(e){ el('status').textContent = 'Relay unreachable'; }
}

function addBubble(m){
  const mine = m.sender === seenByName;
  const row = document.createElement('div'); row.className = 'row' + (mine ? ' me' : '');
  const wrap = document.createElement('div');
  if(!mine){ const who = document.createElement('div'); who.className='who'; who.textContent=m.sender; wrap.appendChild(who); }
  const b = document.createElement('div'); b.className='bubble'; b.textContent = m.text; wrap.appendChild(b);
  row.appendChild(wrap);
  const log = el('log'); log.appendChild(row); log.scrollTop = log.scrollHeight;
}

async function send(){
  const t = el('draft').value.trim(); if(!t) return;
  el('draft').value = '';
  await api('/api/send', {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({text:t})});
  poll();
}

async function startCall(){
  if(!cfg.callURL){ return; }
  try { await api('/api/ring', {method:'POST'}); } catch(e){}
  window.open(cfg.callURL, '_blank');
}

load();
</script>
</body>
</html>
