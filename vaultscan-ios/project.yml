name: VaultScan
options:
  bundleIdPrefix: uk.co.rossdymond
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.10"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic

targets:
  VaultScan:
    type: application
    platform: iOS
    sources:
      - VaultScan
    info:
      path: VaultScan/Info.plist
      properties:
        CFBundleDisplayName: VaultScan
        UILaunchScreen:
          UIColorName: ""
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        NSCameraUsageDescription:
          VaultScan uses the camera to scan documents, receipts, manuals, and warranties.
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: uk.co.rossdymond.vaultscan
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: false
