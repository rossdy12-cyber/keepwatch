# XcodeGen project description. The "Build Lumen IPA" workflow turns this into
# Lumen.xcodeproj with `xcodegen generate`, so nobody has to edit a .pbxproj.
name: Lumen
options:
  bundleIdPrefix: app.lumen
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.0"
    SWIFT_STRICT_CONCURRENCY: minimal
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"

targets:
  Lumen:
    type: application
    platform: iOS
    sources:
      - path: Lumen
      - path: Shared
    dependencies:
      - target: LumenControls
      - target: JarvisWatch
        embed: true
    settings:
      base:
        PRODUCT_NAME: Lumen
        PRODUCT_BUNDLE_IDENTIFIER: app.lumen.camera
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: ""
        CODE_SIGNING_REQUIRED: "NO"
        CODE_SIGNING_ALLOWED: "NO"
        DEVELOPMENT_TEAM: ""
    info:
      path: Lumen/Info.plist
      properties:
        CFBundleDisplayName: Lumen
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSRequiresIPhoneOS: true
        ITSAppUsesNonExemptEncryption: false
        UILaunchScreen:
          UIColorName: LaunchBackground
        UIUserInterfaceStyle: Dark
        UIStatusBarHidden: true
        UIViewControllerBasedStatusBarAppearance: false
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        NSCameraUsageDescription: Lumen uses the camera to take photos and videos.
        NSMicrophoneUsageDescription: Lumen records sound with your videos and Live Photos.
        NSPhotoLibraryAddUsageDescription: Lumen saves the photos you take and edit to your library.
        NSPhotoLibraryUsageDescription: Lumen opens photos from your library so you can edit them.
        NSLocationWhenInUseUsageDescription: Lumen adds where you took a photo to it, if you turn on location tagging.
        NSLocalNetworkUsageDescription: Lumen sends photos to the AI upscaler on your own NAS.
        # The upscaler on the NAS is reached over plain http (Tailscale or home network).
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true

  # Control Centre / Lock Screen / Action button control that opens Lumen (iOS 18+).
  LumenControls:
    type: app-extension
    platform: iOS
    deploymentTarget: "18.0"
    sources:
      - path: LumenControls
      - path: Shared
    settings:
      base:
        PRODUCT_NAME: LumenControls
        PRODUCT_BUNDLE_IDENTIFIER: app.lumen.camera.controls
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: ""
        CODE_SIGNING_REQUIRED: "NO"
        CODE_SIGNING_ALLOWED: "NO"
        DEVELOPMENT_TEAM: ""
        SKIP_INSTALL: "YES"
    info:
      path: LumenControls/Info.plist
      properties:
        CFBundleDisplayName: Lumen
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension

  # J.A.R.V.I.S. Apple Watch app, carried inside Lumen so it installs on the Watch via the companion
  # (no extra free-account app slot needed). Sources are shared with OmniContainer's watch app.
  JarvisWatch:
    type: application
    platform: watchOS
    deploymentTarget: "10.0"
    sources:
      - path: ../omnicontainer/OmniWatch
    settings:
      base:
        PRODUCT_NAME: JarvisWatch
        PRODUCT_BUNDLE_IDENTIFIER: app.lumen.camera.watchkitapp
        TARGETED_DEVICE_FAMILY: "4"
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: ""
        CODE_SIGNING_REQUIRED: "NO"
        CODE_SIGNING_ALLOWED: "NO"
        DEVELOPMENT_TEAM: ""
    info:
      path: JarvisWatch/Info.plist
      properties:
        CFBundleDisplayName: "J.A.R.V.I.S."
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        WKApplication: true
        # SideStore re-signs Lumen and appends the free team ID to its bundle ID
        # (app.lumen.camera -> app.lumen.camera.N2X67JY7VV) but does NOT rewrite this
        # companion key, so it must already carry the team-suffixed ID to match.
        WKCompanionAppBundleIdentifier: app.lumen.camera.N2X67JY7VV
        WKRunsIndependentlyOfCompanionApp: true
        WKBackgroundModes:
          - self-care
          - mindfulness
          - workout-processing
        NSHealthShareUsageDescription: "J.A.R.V.I.S. shows your live heart rate and steps on its Watch faces."
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
