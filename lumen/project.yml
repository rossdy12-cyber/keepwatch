# XcodeGen project description. The "Build Lumen IPA" workflow turns this into
# Lumen.xcodeproj with `xcodegen generate`, so nobody has to edit a .pbxproj.
name: Lumen
options:
  bundleIdPrefix: app.lumen
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.0"
    SWIFT_STRICT_CONCURRENCY: minimal
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"

targets:
  Lumen:
    type: application
    platform: iOS
    sources:
      - path: Lumen
    settings:
      base:
        PRODUCT_NAME: Lumen
        PRODUCT_BUNDLE_IDENTIFIER: app.lumen.camera
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: ""
        CODE_SIGNING_REQUIRED: "NO"
        CODE_SIGNING_ALLOWED: "NO"
        DEVELOPMENT_TEAM: ""
    info:
      path: Lumen/Info.plist
      properties:
        CFBundleDisplayName: Lumen
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSRequiresIPhoneOS: true
        ITSAppUsesNonExemptEncryption: false
        UILaunchScreen:
          UIColorName: LaunchBackground
        UIUserInterfaceStyle: Dark
        UIStatusBarHidden: true
        UIViewControllerBasedStatusBarAppearance: false
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        NSCameraUsageDescription: Lumen uses the camera to take photos and videos.
        NSMicrophoneUsageDescription: Lumen records sound with your videos.
        NSPhotoLibraryAddUsageDescription: Lumen saves the photos you take and edit to your library.
        NSPhotoLibraryUsageDescription: Lumen opens photos from your library so you can edit them.
        NSLocationWhenInUseUsageDescription: Lumen adds where you took a photo to it, if you turn on location tagging.
        NSLocalNetworkUsageDescription: Lumen sends photos to the AI upscaler on your own NAS.
        # The upscaler on the NAS is reached over plain http (Tailscale or home network).
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
