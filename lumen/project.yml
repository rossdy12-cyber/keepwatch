# XcodeGen project description. The "Build Lumen IPA" workflow turns this into
# Lumen.xcodeproj with `xcodegen generate`, so nobody has to edit a .pbxproj.
name: Lumen
options:
  bundleIdPrefix: app.lumen
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.0"
    SWIFT_STRICT_CONCURRENCY: minimal
    MARKETING_VERSION: "1.2.0"
    CURRENT_PROJECT_VERSION: "3"

targets:
  Lumen:
    type: application
    platform: iOS
    sources:
      - path: Lumen
      - path: Shared
    dependencies:
      - target: LumenControls
    settings:
      base:
        PRODUCT_NAME: Lumen
        PRODUCT_BUNDLE_IDENTIFIER: app.lumen.camera
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: ""
        CODE_SIGNING_REQUIRED: "NO"
        CODE_SIGNING_ALLOWED: "NO"
        DEVELOPMENT_TEAM: ""
    info:
      path: Lumen/Info.plist
      properties:
        CFBundleDisplayName: Lumen
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSRequiresIPhoneOS: true
        ITSAppUsesNonExemptEncryption: false
        UILaunchScreen:
          UIColorName: LaunchBackground
        UIUserInterfaceStyle: Dark
        UIStatusBarHidden: true
        UIViewControllerBasedStatusBarAppearance: false
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        NSCameraUsageDescription: Lumen uses the camera to take photos and videos.
        NSMicrophoneUsageDescription: Lumen records sound with your videos and Live Photos.
        NSPhotoLibraryAddUsageDescription: Lumen saves the photos you take and edit to your library.
        NSPhotoLibraryUsageDescription: Lumen opens photos from your library so you can edit them.
        NSLocationWhenInUseUsageDescription: Lumen adds where you took a photo to it, if you turn on location tagging.
        NSLocalNetworkUsageDescription: Lumen sends photos to the AI upscaler on your own NAS.
        # The upscaler on the NAS is reached over plain http (Tailscale or home network).
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true

  # Control Centre / Lock Screen / Action button control that opens Lumen (iOS 18+).
  LumenControls:
    type: app-extension
    platform: iOS
    deploymentTarget: "18.0"
    sources:
      - path: LumenControls
      - path: Shared
    settings:
      base:
        PRODUCT_NAME: LumenControls
        PRODUCT_BUNDLE_IDENTIFIER: app.lumen.camera.controls
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: ""
        CODE_SIGNING_REQUIRED: "NO"
        CODE_SIGNING_ALLOWED: "NO"
        DEVELOPMENT_TEAM: ""
        SKIP_INSTALL: "YES"
    info:
      path: LumenControls/Info.plist
      properties:
        CFBundleDisplayName: Lumen
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension

  # NOTE: The J.A.R.V.I.S. Apple Watch app was briefly embedded here to ride onto the Watch via
  # Lumen's companion slot. That route is parked: free sideloaders (SideStore) can't provision a
  # watch app ("integrity could not be verified"), and Xcode 27 (needed for the watchOS 27 SDK /
  # device support) is Apple-Silicon only, so it won't run on the current Ryzen Hackintosh. The
  # watch sources live in omnicontainer/OmniWatch for whenever Apple Silicon or a paid account
  # (TestFlight) is available. Re-add a `JarvisWatch` watchOS target + `embed: true` dependency to
  # revive it, using the plain app.lumen.camera / app.lumen.camera.watchkitapp convention for an
  # Xcode-signed build (the N2X67JY7VV suffixes were a SideStore-only workaround).
