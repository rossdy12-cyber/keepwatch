name: EtherLauncher
options:
  bundleIdPrefix: com.ross
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "16.0"
  generateEmptyDirectories: true

settings:
  base:
    SWIFT_VERSION: "5.0"
    SWIFT_STRICT_CONCURRENCY: minimal
    TARGETED_DEVICE_FAMILY: "1"
    SUPPORTS_MACCATALYST: NO
    CODE_SIGNING_ALLOWED: NO
    CODE_SIGNING_REQUIRED: NO
    CODE_SIGN_IDENTITY: ""
    DEVELOPMENT_TEAM: ""
    ENABLE_USER_SCRIPT_SANDBOXING: YES

targets:
  EtherLauncher:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: EtherLauncher
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ross.etherlauncher
        PRODUCT_NAME: EtherLauncher
        INFOPLIST_KEY_CFBundleDisplayName: "ÆTHER OS"
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIStatusBarStyle: UIStatusBarStyleLightContent
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: "UIInterfaceOrientationPortrait"
    info:
      path: EtherLauncher/Info.plist
      properties:
        CFBundleDisplayName: "ÆTHER OS"
        CFBundleURLTypes:
          - CFBundleTypeRole: Editor
            CFBundleURLName: com.ross.etherlauncher
            CFBundleURLSchemes:
              - etherlauncher
        LSApplicationQueriesSchemes:
          - whatsapp
          - youtube
          - spotify
          - ms-outlook
          - googlegmail
          - shortcuts
          - mobilenotes
          - calshow
          - photos-redirect
          - camera
          - maps
        UILaunchScreen: {}
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
        NSLocalNetworkUsageDescription: "ÆTHER OS connects to your Bazzite PC and Racebolt UK telemetry server on LAN and Tailscale."
