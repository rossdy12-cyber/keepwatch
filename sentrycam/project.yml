name: SentryCam
options:
  bundleIdPrefix: app.sentrycam
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.0"
    SWIFT_STRICT_CONCURRENCY: minimal
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"

targets:
  SentryCam:
    type: application
    platform: iOS
    sources:
      - path: SentryCam
      - path: Shared
    dependencies:
      - target: SentryCamWidget
    settings:
      base:
        PRODUCT_NAME: SentryCam
        PRODUCT_BUNDLE_IDENTIFIER: app.sentrycam.nvr
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: ""
        CODE_SIGNING_REQUIRED: "NO"
        CODE_SIGNING_ALLOWED: "NO"
        DEVELOPMENT_TEAM: ""
        CODE_SIGN_ENTITLEMENTS: SentryCam.entitlements
    info:
      path: SentryCam/Info.plist
      properties:
        CFBundleDisplayName: "SentryCam"
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSRequiresIPhoneOS: true
        ITSAppUsesNonExemptEncryption: false
        UILaunchScreen:
          UIColorName: LaunchBackground
        UIUserInterfaceStyle: Dark
        UIStatusBarStyle: UIStatusBarStyleLightContent
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
        NSLocalNetworkUsageDescription: "SentryCam connects to your Tailscale and local homelab nodes."
        # Tapping a Frigate push (via frigate-ntfy) opens the clip: sentrycam://event/<id>, sentrycam://camera/<name>.
        CFBundleURLTypes:
          - CFBundleURLName: app.sentrycam.nvr
            CFBundleURLSchemes:
              - sentrycam

  SentryCamWidget:
    type: app-extension
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: SentryCamWidget
      - path: Shared
    settings:
      base:
        PRODUCT_NAME: SentryCamWidget
        PRODUCT_BUNDLE_IDENTIFIER: app.sentrycam.nvr.widget
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: ""
        CODE_SIGNING_REQUIRED: "NO"
        CODE_SIGNING_ALLOWED: "NO"
        DEVELOPMENT_TEAM: ""
        SKIP_INSTALL: "YES"
        CODE_SIGN_ENTITLEMENTS: SentryCamWidget.entitlements
    info:
      path: SentryCamWidget/Info.plist
      properties:
        CFBundleDisplayName: "SentryCam"
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
