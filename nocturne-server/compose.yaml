# Standalone Nocturne server — chat relay + video-call signalling + native Apple push. No jarvis-core needed.
# Put this folder on your TrueNAS and deploy as a custom app (it builds the small Go binary itself).
services:
  nocturne-server:
    build: .
    restart: unless-stopped
    ports:
      - "8990:8990"
    volumes:
      - nocturne-data:/data        # chat history + registered push tokens
    environment:
      PORT: "8990"
      # Optional shared secret. If set, put the SAME value as the "Token" in the apps. Empty = open on your LAN.
      AUTH_TOKEN: ""
      # --- Native Apple push (APNs) ---
      # Needs an EXPLICIT App ID (app.nocturne.client) with Push enabled + a .p8 key, and the signer resigning
      # Nocturne with that push profile. Leave APNS_KEY_P8 empty to run without push (chat still works).
      APNS_KEY_ID: ""              # the 10-char Key ID of your .p8
      APNS_TEAM_ID: "G42YL9QS8W"
      APNS_BUNDLE_ID: "app.nocturne.client"
      APNS_ENV: "auto"             # auto tries production then sandbox
      APNS_KEY_P8: ""              # paste the whole .p8 as a YAML block:
      #   APNS_KEY_P8: |
      #     -----BEGIN PRIVATE KEY-----
      #     ...your key...
      #     -----END PRIVATE KEY-----
      # --- Video calls across networks (optional) ---
      TURN_URL: ""                 # e.g. turn:turn.nas-server.co.uk:3478
      TURN_USER: ""
      TURN_PASS: ""
      TZ: Europe/London

volumes:
  nocturne-data:
