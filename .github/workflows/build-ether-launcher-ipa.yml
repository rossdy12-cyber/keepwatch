name: Build EtherLauncher IPA

on:
  push:
    branches: [main, "claude/**"]
    paths:
      - "ether-launcher/**"
      - ".github/workflows/build-ether-launcher-ipa.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    runs-on: macos-15
    timeout-minutes: 30
    defaults:
      run:
        working-directory: ether-launcher
    steps:
      - name: Check out the code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build EtherLauncher & Embedded EtherWidgets.appex (unsigned)
        run: |
          set -o pipefail
          xcodebuild \
            -project EtherLauncher.xcodeproj \
            -target EtherLauncher \
            -configuration Release \
            -sdk iphoneos \
            SYMROOT="$PWD/build" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            AD_HOC_CODE_SIGNING_ALLOWED=YES \
            build

      - name: Verify EtherWidgets.appex Info.plist & Ad-hoc Sign
        run: |
          APP_DIR="build/Release-iphoneos/EtherLauncher.app"
          EXT_DIR="$APP_DIR/PlugIns/EtherWidgets.appex"
          ls -la "$EXT_DIR"
          plutil -p "$EXT_DIR/Info.plist"
          codesign -f -s - "$EXT_DIR"
          codesign -f -s - "$APP_DIR"

      - name: Package Payload/EtherLauncher.app into EtherLauncher.ipa
        run: |
          mkdir -p out/Payload
          cp -R build/Release-iphoneos/EtherLauncher.app out/Payload/
          cd out
          zip -qry EtherLauncher.ipa Payload
          rm -rf Payload
          ls -lh EtherLauncher.ipa

      - name: Upload EtherLauncher.ipa Artifact
        uses: actions/upload-artifact@v4
        with:
          name: EtherLauncher-ipa
          path: ether-launcher/out/EtherLauncher.ipa
          retention-days: 30

      - name: Commit Built EtherLauncher.ipa for Local PC Sync
        run: |
          cp out/EtherLauncher.ipa EtherLauncher.ipa
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f EtherLauncher.ipa
          git commit -m "Update built EtherLauncher.ipa [skip ci]" || true
          git pull --rebase origin main
          git push origin HEAD:main
