name: Build Paydays shortcut

on:
  push:
    branches: [main, "claude/**"]
    paths:
      - "paydays/shortcut/**"
      - ".github/workflows/build-paydays-shortcut.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - name: Check out the code
        uses: actions/checkout@v4

      - name: Build the shortcut
        run: python3 paydays/shortcut/make_shortcut.py unsigned.shortcut

      - name: Sign it so iPhones will import it
        run: |
          shortcuts sign --mode anyone --input unsigned.shortcut --output "Paydays Apple Pay.shortcut"
          ls -l "Paydays Apple Pay.shortcut"

      - name: Upload the shortcut
        uses: actions/upload-artifact@v4
        with:
          name: Paydays-shortcut
          path: Paydays Apple Pay.shortcut
          retention-days: 30
