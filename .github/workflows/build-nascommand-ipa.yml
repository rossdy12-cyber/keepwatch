name: Build NAS Command IPA

on:
  push:
    branches: [main, "claude/**"]
    paths:
      - "nascommand/**"
      - ".github/workflows/build-nascommand-ipa.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 45
    defaults:
      run:
        working-directory: nascommand
    steps:
      - name: Check out the code
        uses: actions/checkout@v4

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate the Xcode project
        run: xcodegen generate

      - name: Build the app (no code signing)
        run: |
          set -o pipefail
          xcodebuild \
            -project NASCommand.xcodeproj \
            -target NASCommand \
            -configuration Release \
            -sdk iphoneos \
            SYMROOT="$PWD/build" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            -quiet \
            build

      - name: Package Payload into NASCommand.ipa
        run: |
          mkdir -p out/Payload
          cp -R "build/Release-iphoneos/NAS Command.app" out/Payload/
          cd out
          zip -qry NASCommand.ipa Payload
          ls -lh NASCommand.ipa

      - name: Upload the .ipa
        uses: actions/upload-artifact@v4
        with:
          name: NASCommand-ipa
          path: nascommand/out/NASCommand.ipa
          retention-days: 30
