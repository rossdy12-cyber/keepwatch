name: Build OmniContainer IPA

on:
  push:
    branches: [main, "claude/**"]
    paths:
      - "omnicontainer/**"
      - "t1d-monitor/GlucoPulse/**"
      - ".github/workflows/build-omnicontainer-ipa.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 45
    defaults:
      run:
        working-directory: omnicontainer
    steps:
      - name: Check out the code
        uses: actions/checkout@v4

      - name: Sync shared GlucoPulse implementation into embedded module
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          source = Path('../t1d-monitor/GlucoPulse')
          destination = Path('OmniContainer/KeepwatchCore/GlucoPulse')
          mapping = {
              'App/GlucoStore.swift': 'GlucoStore.swift',
              'App/DexcomG7NativeAuth.swift': 'DexcomG7NativeAuth.swift',
              'App/BolusRequestService.swift': 'BolusRequestService.swift',
              'Views/BolusRequestView.swift': 'BolusRequestView.swift',
              'Views/DashboardView.swift': 'GlucoDashboardView.swift',
              'Views/PumpHistoryView.swift': 'GlucoPumpHistoryView.swift',
              'Views/SettingsView.swift': 'GlucoSettingsView.swift',
          }
          renames = {
              'DashboardView': 'GlucoDashboardView',
              'PumpHistoryView': 'GlucoPumpHistoryView',
              'SettingsView': 'GlucoSettingsView',
          }
          pending = {}
          for relative, name in mapping.items():
              text = (source / relative).read_text()
              for old, new in renames.items():
                  text = re.sub(r'\b' + old + r'\b', new, text)
              pending[name] = text
          destination.mkdir(parents=True, exist_ok=True)
          for name, text in pending.items():
              (destination / name).write_text(text)
              print(f'Synced {name}')
          PY

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate the Xcode project
        run: xcodegen generate

      - name: Build OmniContainer (unsigned)
        run: |
          set -o pipefail
          xcodebuild \
            -project OmniContainer.xcodeproj \
            -target OmniContainer \
            -configuration Release \
            -sdk iphoneos \
            SYMROOT="$PWD/build" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      - name: Build J.A.R.V.I.S. Wrist OS (Watch/OmniWatch.app + OmniWatchWidgets.appex)
        run: |
          tr -d '\r' < build_watch_bundle.sh > build_watch_bundle_lf.sh
          bash build_watch_bundle_lf.sh
          rm -f build_watch_bundle_lf.sh

      - name: Build OmniContainerPlugin.dylib & Patch zxPluginsInject.dylib for YouTube Plus
        run: |
          mkdir -p out
          xcrun --sdk iphoneos clang \
            -arch arm64 \
            -mios-version-min=17.0 \
            -fobjc-arc \
            -c Plugin/OmniPluginEntry.m \
            -o out/OmniPluginEntry.o

          xcrun --sdk iphoneos swiftc \
            -emit-library \
            -target arm64-apple-ios17.0 \
            -O \
            -D OMNI_DYLIB_PLUGIN \
            -module-name OmniContainerPlugin \
            -Xlinker -install_name -Xlinker @rpath/OmniContainerPlugin.dylib \
            OmniContainer/OmniContainerApp.swift \
            $(find OmniContainer/KeepwatchCore -name '*.swift') \
            out/OmniPluginEntry.o \
            -o out/OmniContainerPlugin.dylib

          rm -f out/OmniPluginEntry.o
          codesign -f -s - out/OmniContainerPlugin.dylib
          otool -L out/OmniContainerPlugin.dylib

          cp Plugin/zxPluginsInject.dylib out/zxPluginsInject.dylib
          codesign --remove-signature out/zxPluginsInject.dylib
          python3 Plugin/patch_zx_dylib.py out/zxPluginsInject.dylib
          codesign -f -s - out/zxPluginsInject.dylib
          otool -L out/zxPluginsInject.dylib

      - name: Package Payload/OmniContainer.app into OmniContainer.ipa
        run: |
          mkdir -p out/Payload
          cp -R build/Release-iphoneos/OmniContainer.app out/Payload/
          cd out
          zip -qry OmniContainer.ipa Payload
          rm -rf Payload
          ls -lh

      - name: Upload OmniContainer.ipa and Plugin Dylibs
        uses: actions/upload-artifact@v4
        with:
          name: OmniContainer-ipa
          path: |
            omnicontainer/out/OmniContainer.ipa
            omnicontainer/out/OmniContainerPlugin.dylib
            omnicontainer/out/zxPluginsInject.dylib
          retention-days: 30
