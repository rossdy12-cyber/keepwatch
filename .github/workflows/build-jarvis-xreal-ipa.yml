name: Build Jarvis XREAL IPA

on:
  push:
    branches: [main, "claude/**"]
    paths:
      - "jarvis-xreal/**"
      - ".github/workflows/build-jarvis-xreal-ipa.yml"
  workflow_dispatch:

concurrency:
  group: build-jarvis-xreal-ipa
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 45
    defaults:
      run:
        working-directory: jarvis-xreal
    steps:
      - name: Check out the code
        uses: actions/checkout@v4

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate the Xcode project
        run: xcodegen generate

      - name: Build the app (no code signing)
        run: |
          set -o pipefail
          xcodebuild \
            -project JarvisXREAL.xcodeproj \
            -target JarvisXREAL \
            -configuration Release \
            -sdk iphoneos \
            SYMROOT="$PWD/build" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      - name: Package Payload/JarvisXREAL.app into JarvisXREAL.ipa
        run: |
          mkdir -p out/Payload
          cp -R build/Release-iphoneos/JarvisXREAL.app out/Payload/
          cd out
          zip -qry JarvisXREAL.ipa Payload
          ls -lh JarvisXREAL.ipa

      - name: Upload the .ipa
        uses: actions/upload-artifact@v4
        with:
          name: JarvisXREAL-ipa
          path: jarvis-xreal/out/JarvisXREAL.ipa
          retention-days: 30
