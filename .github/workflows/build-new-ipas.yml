name: Build New iOS IPAs (LinkVault, NASFiles, VaultScan, MediaPipe, PhotoVault)

on:
  push:
    branches: [main, "claude/**"]
    paths:
      - "linkvault-ios/**"
      - "nas-files-ios/**"
      - "vaultscan-ios/**"
      - "mediapipe-ios/**"
      - "photoprism-vault/**"
      - ".github/workflows/build-new-ipas.yml"
  workflow_dispatch:

jobs:
  build:
    name: Build New iOS IPAs
    runs-on: macos-15
    timeout-minutes: 35

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Build and package MediaPipe.ipa
        working-directory: mediapipe-ios
        run: |
          set -o pipefail
          xcodegen generate
          xcodebuild \
            -project MediaPipe.xcodeproj \
            -scheme MediaPipe \
            -configuration Release \
            -sdk iphoneos \
            SYMROOT="$PWD/build" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build
          mkdir -p out/Payload
          cp -R "build/Release-iphoneos/MediaPipe.app" out/Payload/
          rm -rf "out/Payload/MediaPipe.app/PlugIns"
          rm -f "out/Payload/MediaPipe.app/embedded.mobileprovision"
          cd out
          zip -qry MediaPipe.ipa Payload
          rm -rf Payload
          ls -lh MediaPipe.ipa

      - name: Upload MediaPipe-ipa
        uses: actions/upload-artifact@v4
        with:
          name: MediaPipe-ipa
          path: mediapipe-ios/out/MediaPipe.ipa
          if-no-files-found: error
          retention-days: 30
