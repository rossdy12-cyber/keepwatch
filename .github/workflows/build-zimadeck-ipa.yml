name: Build ZimaDeck IPA

on:
  push:
    branches: [main, "claude/**"]
    paths:
      - "zimadeck/**"
      - ".github/workflows/build-zimadeck-ipa.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 45
    defaults:
      run:
        working-directory: zimadeck
    steps:
      - name: Check out the code
        uses: actions/checkout@v4

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate the Xcode project
        run: xcodegen generate

      - name: Build ZimaDeck (unsigned)
        run: |
          set -o pipefail
          xcodebuild \
            -project ZimaDeck.xcodeproj \
            -target ZimaDeck \
            -configuration Release \
            -sdk iphoneos \
            SYMROOT="$PWD/build" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      - name: Package Payload/ZimaDeck.app into ZimaDeck.ipa
        run: |
          mkdir -p out/Payload
          cp -R build/Release-iphoneos/ZimaDeck.app out/Payload/
          cd out
          zip -qry ZimaDeck.ipa Payload
          ls -lh ZimaDeck.ipa

      - name: Upload ZimaDeck.ipa artifact
        uses: actions/upload-artifact@v4
        with:
          name: ZimaDeck-ipa
          path: zimadeck/out/ZimaDeck.ipa
          retention-days: 30
