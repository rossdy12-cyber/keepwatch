name: Build AegisMobile IPA

on:
  push:
    branches: [main, "claude/**"]
    paths:
      - "aegis-mobile/**"
      - ".github/workflows/build-aegis-mobile-ipa.yml"
  workflow_dispatch:

concurrency:
  group: build-aegis-mobile-ipa
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 45
    defaults:
      run:
        working-directory: aegis-mobile
    steps:
      - name: Check out the code
        uses: actions/checkout@v4

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate the Xcode project
        run: xcodegen generate

      - name: Build the app (no code signing)
        run: |
          set -o pipefail
          xcodebuild \
            -project AegisMobile.xcodeproj \
            -target AegisMobile \
            -configuration Release \
            -sdk iphoneos \
            SYMROOT="$PWD/build" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      - name: Package Payload/AegisMobile.app into AegisMobile.ipa
        run: |
          mkdir -p out/Payload
          cp -R build/Release-iphoneos/AegisMobile.app out/Payload/
          cd out
          zip -qry AegisMobile.ipa Payload
          ls -lh AegisMobile.ipa

      - name: Upload the .ipa
        uses: actions/upload-artifact@v4
        with:
          name: AegisMobile-ipa
          path: aegis-mobile/out/AegisMobile.ipa
          retention-days: 30
