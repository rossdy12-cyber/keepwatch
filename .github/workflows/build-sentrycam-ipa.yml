name: Build SentryCam IPA

on:
  push:
    branches: [main, "claude/**"]
    paths:
      - "sentrycam/**"
      - ".github/workflows/build-sentrycam-ipa.yml"
  workflow_dispatch:

concurrency:
  group: build-sentrycam-ipa
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 45
    defaults:
      run:
        working-directory: sentrycam
    steps:
      - name: Check out the code
        uses: actions/checkout@v4

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate the Xcode project
        run: xcodegen generate

      - name: Build the app (no code signing)
        run: |
          set -o pipefail
          xcodebuild \
            -project SentryCam.xcodeproj \
            -target SentryCam \
            -configuration Release \
            -sdk iphoneos \
            SYMROOT="$PWD/build" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      - name: Package Payload/SentryCam.app into SentryCam.ipa
        run: |
          mkdir -p out/Payload
          cp -R build/Release-iphoneos/SentryCam.app out/Payload/
          cd out
          zip -qry SentryCam.ipa Payload
          ls -lh SentryCam.ipa

      - name: Upload the .ipa
        uses: actions/upload-artifact@v4
        with:
          name: SentryCam-ipa
          path: sentrycam/out/SentryCam.ipa
          retention-days: 30
