name: Build PhotoPulse IPA

on:
  push:
    branches: [main, "claude/**"]
    paths:
      - "photopulse/**"
      - ".github/workflows/build-photopulse-ipa.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 45
    defaults:
      run:
        working-directory: photopulse
    steps:
      - name: Check out the code
        uses: actions/checkout@v4

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate the Xcode project
        run: xcodegen generate

      - name: Build PhotoPulse (unsigned)
        run: |
          set -o pipefail
          xcodebuild \
            -project PhotoPulse.xcodeproj \
            -target PhotoPulse \
            -configuration Release \
            -sdk iphoneos \
            SYMROOT="$PWD/build" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      - name: Package Payload/PhotoPulse.app into PhotoPulse.ipa
        run: |
          mkdir -p out/Payload
          cp -R build/Release-iphoneos/PhotoPulse.app out/Payload/
          cd out
          zip -qry PhotoPulse.ipa Payload
          ls -lh PhotoPulse.ipa

      - name: Upload PhotoPulse.ipa artifact
        uses: actions/upload-artifact@v4
        with:
          name: PhotoPulse-ipa
          path: photopulse/out/PhotoPulse.ipa
          retention-days: 30
