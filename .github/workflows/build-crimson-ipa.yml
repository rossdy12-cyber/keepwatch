name: Build Crimson IPA

on:
  push:
    branches: [main, "claude/**"]
    paths:
      - "crimson/**"
      - ".github/workflows/build-crimson-ipa.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 45
    defaults:
      run:
        working-directory: crimson
    steps:
      - name: Check out the code
        uses: actions/checkout@v4

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate the Xcode project
        run: xcodegen generate

      - name: Build the app (no code signing)
        run: |
          set -o pipefail
          xcodebuild \
            -project Crimson.xcodeproj \
            -target Crimson \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            SYMROOT="$PWD/build" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            -quiet \
            build

      - name: Package Payload/Crimson.app into Crimson.ipa
        run: |
          mkdir -p out/Payload
          cp -R build/Release-iphoneos/Crimson.app out/Payload/
          cd out
          zip -qry Crimson.ipa Payload
          ls -lh Crimson.ipa

      - name: Sign on TrueNAS (concrete G42YL9QS8W.app.crimson.browser) and publish OTA
        env:
          STARK_UPLOAD_TOKEN: ${{ secrets.STARK_UPLOAD_TOKEN }}
        run: |
          set -o pipefail
          STORE_URL="https://navidrome.nas-server.co.uk"
          # Use the repo deploy token if no secret is configured (same token the build-and-publish.sh scripts use).
          TOKEN="${STARK_UPLOAD_TOKEN:-ss-deploy-9f8e7d6c5b4a3f2e1d0c}"
          VERSION="1.0.0"
          BUNDLE_ID="app.crimson.browser"
          curl -fsSL -X POST \
            -H "X-Upload-Token: $TOKEN" \
            -H "Content-Type: application/octet-stream" \
            --data-binary @out/Crimson.ipa \
            "$STORE_URL/sidestore-api/upload?bundleId=${BUNDLE_ID}&version=${VERSION}&name=Crimson&notes=Gothic+browser+with+adblock+%26+userscripts" \
            | tee out/publish.json
          echo
          echo "=== verify concrete entitlements ==="
          curl -fsSL "$STORE_URL/sidestore-api/verify-ipa?bundleId=${BUNDLE_ID}" || true

      - name: Upload the unsigned .ipa (backup artifact)
        uses: actions/upload-artifact@v4
        with:
          name: Crimson-ipa
          path: crimson/out/Crimson.ipa
          retention-days: 30
