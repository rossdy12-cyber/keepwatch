name: Build Conclave IPA

on:
  workflow_dispatch:
  push:
    branches: [main, "claude/**"]
    paths:
      - "conclave/**"
      - "shared/GothicKit/**"
      - "shared/MatrixKit/**"
      - ".github/workflows/build-conclave-ipa.yml"

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 45

    steps:
      - name: Check out the code
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Conclave Xcode project
        working-directory: conclave
        run: xcodegen generate

      - name: Build unsigned Conclave app
        working-directory: conclave
        run: |
          set -o pipefail
          xcodebuild \
            -project Conclave.xcodeproj \
            -target Conclave \
            -configuration Release \
            -sdk iphoneos \
            SYMROOT="$PWD/build" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      - name: Embed the push notification entitlement
        working-directory: conclave
        run: |
          codesign --force --sign - --timestamp=none --entitlements Conclave.entitlements build/Release-iphoneos/Conclave.app
          codesign -d --entitlements - build/Release-iphoneos/Conclave.app

      - name: Package unsigned IPA
        working-directory: conclave
        run: |
          mkdir -p out/Payload
          cp -R build/Release-iphoneos/Conclave.app out/Payload/
          cd out
          zip -qry Conclave.ipa Payload
          ls -lh Conclave.ipa

      - name: Upload Conclave IPA
        uses: actions/upload-artifact@v4
        with:
          name: Conclave-ipa
          path: conclave/out/Conclave.ipa
          retention-days: 30
