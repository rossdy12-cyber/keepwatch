name: Build AuthVault IPA

on:
  push:
    branches: [main, "claude/**"]
    paths:
      - "authvault/**"
      - ".github/workflows/build-authvault-ipa.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 45
    defaults:
      run:
        working-directory: authvault
    steps:
      - name: Check out the code
        uses: actions/checkout@v4

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate the Xcode project
        run: xcodegen generate

      - name: Build the app (no code signing)
        run: |
          set -o pipefail
          xcodebuild \
            -project AuthVault.xcodeproj \
            -target AuthVault \
            -configuration Release \
            -sdk iphoneos \
            SYMROOT="$PWD/build" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            -quiet \
            build

      - name: Package Payload/AuthVault.app into AuthVault.ipa
        run: |
          mkdir -p out/Payload
          cp -R build/Release-iphoneos/AuthVault.app out/Payload/
          cd out
          zip -qry AuthVault.ipa Payload
          ls -lh AuthVault.ipa

      - name: Upload the .ipa
        uses: actions/upload-artifact@v4
        with:
          name: AuthVault-ipa
          path: authvault/out/AuthVault.ipa
          retention-days: 30
