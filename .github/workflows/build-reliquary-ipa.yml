name: Build Reliquary IPA

on:
  workflow_dispatch:
  push:
    branches: [main, "claude/**"]
    paths:
      - "reliquary/**"
      - ".github/workflows/build-reliquary-ipa.yml"

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 45

    steps:
      - name: Check out the code
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Reliquary Xcode project
        working-directory: reliquary
        run: xcodegen generate

      - name: Build unsigned Reliquary app
        working-directory: reliquary
        run: |
          set -o pipefail
          xcodebuild \
            -project Reliquary.xcodeproj \
            -target Reliquary \
            -configuration Release \
            -sdk iphoneos \
            SYMROOT="$PWD/build" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      - name: Package unsigned IPA
        working-directory: reliquary
        run: |
          mkdir -p out/Payload
          cp -R build/Release-iphoneos/Reliquary.app out/Payload/
          cd out
          zip -qry Reliquary.ipa Payload
          ls -lh Reliquary.ipa

      - name: Upload Reliquary IPA
        uses: actions/upload-artifact@v4
        with:
          name: Reliquary-ipa
          path: reliquary/out/Reliquary.ipa
          retention-days: 30
