name: Build Stark Face (watch)

on:
  push:
    branches: [main, "claude/**"]
    paths:
      - "stark-watch/**"
      - ".github/workflows/build-stark-watch.yml"
  workflow_dispatch:

jobs:
  watch-app:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Build the watch-only Stark Face app (unsigned)
        run: bash stark-watch/build.sh
      - uses: actions/upload-artifact@v4
        with:
          name: StarkFace-ipa
          path: stark-watch/out/StarkFace.ipa
          retention-days: 30
