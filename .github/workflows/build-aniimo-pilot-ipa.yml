name: Build AniimoPilot IPA

on:
  push:
    branches: [main, "claude/**"]
    paths:
      - "aniimo-pilot/**"
      - ".github/workflows/build-aniimo-pilot-ipa.yml"
  workflow_dispatch:

concurrency:
  group: build-aniimo-pilot-ipa
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 45
    defaults:
      run:
        working-directory: aniimo-pilot
    steps:
      - name: Check out the code
        uses: actions/checkout@v4

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate the Xcode project
        run: xcodegen generate

      - name: Build the app (no code signing)
        run: |
          set -o pipefail
          xcodebuild \
            -project AniimoPilot.xcodeproj \
            -target AniimoPilot \
            -configuration Release \
            -sdk iphoneos \
            SYMROOT="$PWD/build" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      - name: Package Payload/AniimoPilot.app into AniimoPilot.ipa
        run: |
          mkdir -p out/Payload
          cp -R build/Release-iphoneos/AniimoPilot.app out/Payload/
          cd out
          zip -qry AniimoPilot.ipa Payload
          ls -lh AniimoPilot.ipa

      - name: Upload the .ipa
        uses: actions/upload-artifact@v4
        with:
          name: AniimoPilot-ipa
          path: aniimo-pilot/out/AniimoPilot.ipa
          retention-days: 30
