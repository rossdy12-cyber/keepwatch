name: Build Jarvis IPA

on:
  push:
    branches: [main, "claude/**"]
    paths:
      - "jarvis/**"
      - ".github/workflows/build-jarvis-ipa.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 45
    defaults:
      run:
        working-directory: jarvis
    steps:
      - name: Check out the code
        uses: actions/checkout@v4

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate the Xcode project
        run: xcodegen generate

      - name: Build the app (no code signing)
        run: |
          set -o pipefail
          xcodebuild \
            -project Jarvis.xcodeproj \
            -target Jarvis \
            -configuration Release \
            -sdk iphoneos \
            SYMROOT="$PWD/build" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            -quiet \
            build

      - name: Package Payload/Jarvis.app into Jarvis.ipa
        run: |
          mkdir -p out/Payload
          cp -R build/Release-iphoneos/Jarvis.app out/Payload/
          cd out
          zip -qry Jarvis.ipa Payload
          ls -lh Jarvis.ipa

      - name: Upload the .ipa
        uses: actions/upload-artifact@v4
        with:
          name: Jarvis-ipa
          path: jarvis/out/Jarvis.ipa
          retention-days: 30
