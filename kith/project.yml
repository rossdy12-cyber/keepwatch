name: Kith
options:
  bundleIdPrefix: app.kith
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.0"
    SWIFT_STRICT_CONCURRENCY: minimal
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"

targets:
  Kith:
    type: application
    platform: iOS
    sources:
      - path: Kith
    settings:
      base:
        PRODUCT_NAME: Kith
        PRODUCT_BUNDLE_IDENTIFIER: app.kith.client
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: ""
        CODE_SIGNING_REQUIRED: "NO"
        CODE_SIGNING_ALLOWED: "NO"
        DEVELOPMENT_TEAM: ""
    info:
      path: Kith/Info.plist
      properties:
        CFBundleDisplayName: Kith
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSRequiresIPhoneOS: true
        ITSAppUsesNonExemptEncryption: false
        UIUserInterfaceStyle: Dark
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        # Your companions think using your jarvis-core, often reached over http on Tailscale/LAN.
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
        NSMicrophoneUsageDescription: Kith listens when you talk to your companion.
        NSSpeechRecognitionUsageDescription: Kith turns what you say into text to send to your companion.
        NSLocalNetworkUsageDescription: Kith connects to your Jarvis core on your network.
